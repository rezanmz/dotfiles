# ly login-screen theme — Dracula, matching 00-theme.lua and hyprlock.conf.
#
# HOW TO APPLY
# ------------
# ly reads its config from /etc/ly/config.ini, which is root-owned, so chezmoi
# cannot manage it (chezmoi only touches $HOME — see README's "/etc files"
# section). Apply the overrides below by editing that file as root:
#
#     sudoedit /etc/ly/config.ini
# or apply them non-interactively, which also takes a backup:
#
#     sudo cp /etc/ly/config.ini /etc/ly/config.ini.bak
#     sudo sed -i \
#       -e 's/^fg = .*/fg = 0x00F8F8F2/' \
#       -e 's/^bg = .*/bg = 0x00282A36/' \
#       -e 's/^border_fg = .*/border_fg = 0x00BD93F9/' \
#       -e 's/^box_title = .*/box_title = Dracula/' \
#       -e 's/^clock = .*/clock = %H:%M/' \
#       -e 's/^bigclock = .*/bigclock = en/' \
#       -e 's/^asterisk = .*/asterisk = 0x2022/' \
#       -e 's/^hide_version_string = .*/hide_version_string = true/' \
#       -e 's/^edge_margin = .*/edge_margin = 1/' \
#       /etc/ly/config.ini
#
# Every pattern above is anchored (^key = ) and was dry-run against a copy of the
# real file before being written down: all nine keys matched and changed, so none
# of these is a silent no-op.
#
# COLOUR FORMAT
# -------------
# ly colours are 0xSSRRGGBB — not ARGB. The most significant byte is a STYLE
# byte (0x00 normal, 0x01 bold), and the remaining three are plain sRGB. That is
# why Dracula's #282a36 becomes 0x00282A36: style 00, then the colour. Writing
# 0xFF282A36 would set a style byte of 0xFF, not an alpha channel. Confirmed
# against ly's own config.ini.example: "the colors are always 32-bit values with
# the styling in the most significant byte".
#
# Values below are the Dracula palette from dot_config/hypr/modules/00-theme.lua:
#   bg #282a36   fg #f8f8f2   purple #bd93f9   pink #ff79c6   comment #6272a4
#
# WHAT CAN AND CANNOT BE DONE
# ---------------------------
# ly is a TUI. It has NO image, wallpaper or background-picture support at all —
# `bg` is a flat colour and that is the whole surface. A wallpaper on the login
# screen is not achievable with ly; that needs a graphical greeter instead.
# Within that constraint the interesting levers are the two clocks, the box title,
# the border colour and the animations.

# ---------------------------------------------------------------- core colours

# Background. Near-Dracula-bg rather than the pure black default, so the login
# screen belongs to the same palette as the desktop behind it.
bg = 0x00282A36

# Foreground for all text.
fg = 0x00F8F8F2

# Border around the main box. Purple, matching the window borders in 40-look.lua
# (which gradient purple -> pink on focus).
border_fg = 0x00BD93F9

# The box keeps its filled background rather than going transparent. Against a
# flat dark `bg` there is nothing to show through, and blank_box=false would just
# make the box boundary harder to read.
blank_box = true

# Title at the top of the box. Replaces the default (none).
box_title = Dracula

# ------------------------------------------------------------------ clock

# Small clock in the top-right corner. 24-hour, since the desktop's waybar clock
# is 24-hour and two different conventions on one machine is a bug, not a choice.
clock = %H:%M

# Large clock inside the box. English; `fa` is available for Farsi if preferred.
bigclock = en
bigclock_12hr = false
bigclock_seconds = false

# ------------------------------------------------------------------ chrome

# The version string is dev-facing noise on a login screen.
hide_version_string = true

# Border art is drawn by ly's own charset; keep it, it is what gives the box its
# shape. Set true for a borderless look.
hide_borders = false

# Key hints stay visible: this is a login screen where the function-key
# shortcuts (session, restart, shutdown) are genuinely useful and undiscoverable
# otherwise.
hide_key_hints = false

# Left-aligned labels read better than centred ones against a wide terminal.
text_in_center = false

# Password mask. A filled circle reads better than an asterisk at any terminal
# font size, and does not collide with the box border glyphs.
asterisk = 0x2022

# ------------------------------------------------------------- animations

# One of: none, doom, matrix, colormix, gameoflife, dur_file.
# Left at none deliberately. Every option is a full-screen animated field:
# matrix and gameoflife are distractingly busy, `doom` is a joke animation, and
# dur_file needs an external .dur asset. A login screen is glanced at for two
# seconds; animation there costs battery and attention and returns nothing.
animation = none

# ------------------------------------------------------------------ layout

# Breathing room around the box.
edge_margin = 1
margin_box_h = 2
margin_box_v = 1

# Password field width in characters.
input_len = 34
