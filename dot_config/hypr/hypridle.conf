# hypridle — lock and suspend timers. Managed by chezmoi
# (dot_config/hypr/hypridle.conf). Runs as the hypridle systemd user unit.

general {
    lock_cmd = hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
    ignore_dbus_inhibit = false
}

# Dim the panel before locking.
listener {
    timeout = 240
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Lock the session.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Suspend. This machine is a desktop with no battery; suspend after an hour of
# inactivity. Remove this block if you never want it to sleep.
listener {
    timeout = 3600
    on-timeout = systemctl suspend
}
