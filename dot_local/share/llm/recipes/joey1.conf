# joey-1 (baselabs), the System One decision model, on this machine's CPU — the judge behind `llm pi27`'s
# auto-thinking.  Not a chat model: it answers typed questions (/v1/systemone) with calibrated probabilities.
#
# joey-1 = Qwen3.5-2B post-trained by Base Labs for single-pass decisions.  Its card's setup.sh wants a CUDA image and
# causal-conv1d/flash-linear-attention, and that is NOT required: qwen3_5 ships pure-torch fallbacks in upstream
# transformers (causal_conv1d_fn -> F.conv1d, chunk/recurrent_gated_delta_rule -> torch_*), so torch 2.15 CPU runs it.
# Measured here 2026-11-21 on the 7800X3D: load 5.9 s, decision 1.06-1.18 s (median 1.07 s) in float32, ~7 GB RSS,
# with both fallbacks announcing themselves in the log.
#
# Wrong on the middle tier: on a 9-case matrix over omp's effort rubric it was 5/9 — 2/3 low, 0/2 medium, 2/2 high,
# 1/2 xhigh; it never chose medium at all.  The extremes and the confidence values are trustworthy (0.78 on an
# unambiguous rename, 0.02 on the case it got wrong).
#
# Rival, rejected: the same family's 9B/27B (elephant-1/mammoth-1) are 18.8/54.8 GB and ship the same torch runtime;
# bison-1/groundhog-1 are Gemma-4 bases at 64/53 GB.  No GGUF of any of them produces decisions: the card for the
# Jev-Style GGUF port says llama.cpp loads it as a chat model and "does not produce decisions".
engine=qev
model=$HOME/models/joey-1
qev_python=$HOME/.local/opt/joeyvenv/bin/python
qev_name=joey-1
port=8078
device=cpu
dtype=float32
about="joey-1 System One decision model (judge), CPU — qev /v1/systemone"
hf=baselabs/joey-1
files="model.safetensors readout.json config.json tokenizer.json tokenizer_config.json chat_template.jinja processor_config.json generation_config.json"
bytes="5443677680 63 2938 19989339 1505 7755 1220 116"
fetch_dir=$HOME/models/joey-1
