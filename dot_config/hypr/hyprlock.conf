# hyprlock — Dracula lock screen. Managed by chezmoi
# (dot_config/hypr/hyprlock.conf).
#
# Background is a blurred screenshot of the session; the input field matches the
# Hyprland active-border gradient (purple -> pink).
#
# Option names are validated against hyprlock 0.9.6 — run
#   hyprlock -c ~/.config/hypr/hyprlock.conf -v
# with no compositor reachable to re-check after edits.

$font = Hack Nerd Font
$accent = rgba(bd93f9ff)
$accent2 = rgba(ff79c6ff)
$fg = rgba(f8f8f2ff)
$muted = rgba(6272a4ff)

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
}

input-field {
    monitor =
    size = 24%, 46
    outline_thickness = 2
    rounding = 8

    inner_color = rgba(282a36cc)
    outer_color = $accent
    check_color = $accent2
    fail_color = rgba(ff5555ff)

    font_color = $fg
    font_family = $font

    placeholder_text = Password
    fail_text = Wrong password

    fade_on_empty = false
    dots_size = 0.26
    dots_spacing = 0.4

    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = $font
    color = $fg

    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 20
    font_family = $font
    color = $muted

    position = 0, 60
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    font_size = 14
    font_family = $font
    color = $muted

    position = 0, 30
    halign = center
    valign = bottom
}
