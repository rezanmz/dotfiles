# fuzzel — Wayland-native launcher, Dracula palette.
# Managed by chezmoi (dot_config/fuzzel/fuzzel.ini).
#
# SUPER+D  launcher (drun)
# Used with --dmenu by dot_local/bin/clipboard-pick and exit-menu.
#
# Schema per fuzzel.ini(5): the border COLOUR key lives in [colors]; the
# [border] section only holds width/radius/selection-radius.

[main]
font=Hack Nerd Font:size=11
dpi-aware=no

prompt=❯
icon-theme=Papirus
icons-enabled=yes

# A 4K panel at scale 1 needs a wider window than the default.
lines=10
width=42
horizontal-pad=18
vertical-pad=14
inner-pad=8

layer=overlay
anchor=center

[border]
width=2
radius=8

[colors]
background=282a36f2
text=f8f8f2ff
prompt=bd93f9ff
input=f8f8f2ff
placeholder=6272a4ff
match=50fa7bff
selection=44475aff
selection-text=f8f8f2ff
selection-match=50fa7bff
border=bd93f9ff
