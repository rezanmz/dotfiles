# Advisor roster for omp.
#
# INERT while `advisor.enabled: false` (config.yml). Enable with
#   omp config set advisor.enabled true        # or /advisor on in-session
# Each review is a separate model call on modelRoles.advisor (or the
# per-advisor `model:` below), so enabling spends tokens every reviewed run.
#
# syncBacklog controls whether the primary WAITS for the verdict:
#   off = advisory only, delivered as an aside/card (cheapest)
#   1|3|5 = wait at that backlog threshold, max 30s
#   strict = wait until scheduled reviews finish, no wall-clock cap
# Flip Final reviewer to `strict` when you want a hard gate before yielding.

instructions: |
  You are a reviewer, not an author. Cite file:line evidence for every
  claim. Stay silent unless you can name a concrete, material problem.
  Prefer one precise blocker over several speculative nits. Never restate
  the work back to the primary.

advisors:
  - name: Final reviewer
    enabled: true
    reviewMode: agent-end
    syncBacklog: off
    instructions: |
      Review the finished run, in this order:
      1. Every claim of "done", "verified", "passing", or "tested" must be
         backed by output produced in THIS session (a command result, test
         run, or file read). An unbacked claim is a blocker.
      2. Changed files with no caller updated, or deleted behavior still
         referenced, are a blocker.
      3. Config written outside the repo (home files, chezmoi source) that
         was left uncommitted or unapplied.
      Report at most one blocker plus two concerns.

  - name: Safety reviewer
    enabled: true
    reviewMode: turn
    reviewInterval: 3
    tools: [read, grep, glob]
    instructions: |
      Watch for irreversible actions and credential exposure: destructive
      git operations, raw writes to ~/.omp, ~/.ssh, or the chezmoi source
      without an `chezmoi apply` path, secrets echoed into the transcript,
      and commands whose blast radius exceeds what the user asked for.
      Flag with evidence; never edit.
