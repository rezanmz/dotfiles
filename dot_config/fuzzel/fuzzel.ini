# fuzzel — Wayland-native launcher, Dracula palette.
# Managed by chezmoi (dot_config/fuzzel/fuzzel.ini).
#
# SUPER+D  launcher (drun)
# Used with --dmenu by dot_local/bin/clipboard-pick and exit-menu.

[main]
font=Hack Nerd Font:size=11
dpi-aware=no

# Prompt
prompt="❯ "
icon-theme=Papirus
icons-enabled=yes

# The 4K panel is a single output at scale 1, so a wider window with a few
# lines beats the default tiny one.
lines=10
width=42
horizontal-pad=18
vertical-pad=14
inner-pad=8

# Match Hyprland's rounding/border radius
layer=overlay
anchor=center

[border]
width=2
radius=8
color=bd93f9ff
selection-color=bd93f9ff

[colors]
background=282a36f2
text=f8f8f2ff
match=50fa7bff
selection=44475aff
selection-text=f8f8f2ff
selection-match=50fa7bff
border=bd93f9ff
