# DeepSeek-V4-Pro-Qwen3.5-9B-UNCENSORED-heretic (xtools-at): Heretic v2 ARA (layers 9-24) on Jackrong's 9B
# DeepSeek-V4-Pro distillation of Qwen3.5-9B — reasoning/math/STEM, 3/100 refusals, tools, vision.
# qwen35: 32 blocks, every 4th full attention (4 kv heads, key/value 256, head_dim 256) and the rest SSM, so 8
# attention layers hold KV: 32 KiB/token at f16, ~17.4 KiB/token at q8_0, ~9.2 KiB/token at q4_0.  The SSM and the
# MTP head are fixed costs.
# Weights: Q8_0 9.11 GiB, the largest tier that fits this 16 GB card.  The BF16 GGUF (17.1 GiB) does not.
# Measured 2026-11-15, 16304 MiB card, desktop busy (Chrome + Steam resident, 1.76 GiB held):
#   262144 ctx, KV q4_0, vision CPU ...... 14.65 GiB used, 1.20 GiB free after an image request
#   262144 ctx, KV q4_0, vision GPU ...... 15.18 GiB used, 0.74 GiB free — mmproj offload costs 0.53 GiB, not worth it
#   196608 ctx, KV q8_0, vision CPU ...... 15.09 GiB used, 0.83 GiB free — rejected, no headroom left
#   131072 ctx, KV q8_0, vision GPU ...... 14.63 GiB used, 1.29 GiB free — the half-context alternative
# 262144 with q4_0 KV buys twice the context for the same memory as 131072 with q8_0, so context wins; the trade is
# KV precision, checked by retrieval: a code planted at 92% depth of a 117772-token prompt came back exact.
# MTP is live: --spec-type draft-mtp against the GGUF's own nextn layer, 0.65-0.77 draft acceptance per request.
# Vision stays on: qwen3vl_merger tower (0.86 GiB), on the CPU because its GPU share goes to KV here.
# The prithivMLmods re-quant carries no tokenizer.chat_template (47 metadata keys, none of them the template), so the
# recipe supplies the author's own — tools + <think>, from xtools-at's repo, tracked in chezmoi beside the recipes.
# llama.cpp b12422, not the box's b12079: qwen35 MTP on a recurrent-hybrid arch picked up fixes after 2026-11-03
# (MTP conv snapshots per recurrent model, NextN layers in n_gpu_layers, mtmd 2x2 merge check).  b12079 still runs the
# other qwen35 recipes; this dir is only for this model.
# Writes: none while serving — /proc/<pid>/io held at 24 KB read / 200 KB write across load, a streaming tool call, an
# image request and a 600-token generation, and a start adds nothing (weights mmap'd, template tracked, download once).
about="DeepSeek-V4-Pro-Qwen3.5-9B UNCENSORED heretic Q8_0, 256K ctx, vision + MTP — llama.cpp Vulkan"
engine=llama
model=$HOME/models/dsv4pro/DeepSeek-V4-Pro-Qwen3.5-9B-UNCENSORED-heretic.Q8_0.gguf
mmproj=$HOME/models/dsv4pro/DeepSeek-V4-Pro-Qwen3.5-9B-UNCENSORED-heretic.mmproj-bf16.gguf
ctx=262144
kv=q4_0
llama_dir=$HOME/.local/opt/llama-b12422
template=$HOME/.local/share/llm/templates/dsv4pro.jinja
args="-ngl 99 --no-mmproj-offload -fa on --image-min-tokens 1024 -ub 1024 -b 2048 -t 8 --parallel 1 --cache-ram 16384 --jinja --temp 0.7 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 0.0 --repeat-penalty 1.0"
flags=""
mtp=1
hf=prithivMLmods/DeepSeek-V4-Pro-Qwen3.5-9B-UNCENSORED-heretic-MTP-GGUF
files="DeepSeek-V4-Pro-Qwen3.5-9B-UNCENSORED-heretic.Q8_0.gguf DeepSeek-V4-Pro-Qwen3.5-9B-UNCENSORED-heretic.mmproj-bf16.gguf"
bytes="9786062176 921705312"
fetch_dir=$HOME/models/dsv4pro
