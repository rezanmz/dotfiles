# Custom model providers for omp (ModelRegistry reads providers: here).
# Managed by chezmoi — no secrets in this file. The NINE_ROUTER_API_KEY
# value lives in ~/.omp/agent/.env (local, untracked, alongside the auth
# store), mirroring the key already held in opencode's auth.json for the
# opencode CLI.
providers:
  9router:
    baseUrl: https://router.reza.network/v1
    api: openai-completions
    authHeader: true
    apiKey: NINE_ROUTER_API_KEY # resolved from env / ~/.omp/agent/.env
    compat:
      supportsReasoningEffort: true
    models:
      - id: chat
        name: 9Router chat (everyday flash combo)
        reasoning: true
        input: [text]
        contextWindow: 131072
        maxTokens: 8192
      - id: smart
        name: 9Router smart (heavy reasoning combo)
        reasoning: true
        input: [text]
        contextWindow: 131072
        maxTokens: 8192
