# Linux X11 desktop profile; applied only on Linux.
theme = "dracula"
icons = "material-nf"

[[block]]
block = "backlight"
cycle = [25, 45, 65, 85]

[[block]]
block = "hueshift"
hue_shifter = "redshift"
step = 50
click_temp = 6500

[[block]]
block = "net"

[[block]]
block = "temperature"
collapsed = false

[[block]]
block = "sound"
on_click = "pavucontrol"

[[block]]
block = "time"
interval = 1
format = "%a %m/%d-%R"

[[block]]
block = "battery"
format = "{percentage} {time}"
