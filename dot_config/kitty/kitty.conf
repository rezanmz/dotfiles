# Font — Latin from Hack Nerd Font Mono (kitty's CoreText matcher only sees
# families whose OS/2 fsSelection sets the monospace bit; the non-mono Nerd
# Font variant lacks it), Persian/Arabic glyphs from Vazirmatn. kitty shapes
# complex scripts (harfbuzz) and applies RTL, unlike alacritty.
font_family      Hack Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# Arabic + Persian letters, Persian digits, and Arabic presentation forms
symbol_map U+0600-U+06FF,U+0750-U+077F,U+FB50-U+FDFF,U+FE70-U+FEFF Vazirmatn

# Disable macOS option-as-alt weirdness
macos_option_as_alt yes

# Colors (Dracula — mirrors dot_config/alacritty/themes/dracula.toml)
foreground            #f8f8f2
background            #282a36
selection_foreground  #f8f8f2
selection_background  #44475a
cursor                #f8f8f2
cursor_text_color     #282a36
url_color             #8be9fd
color0  #000000
color1  #ff5555
color2  #50fa7b
color3  #f1fa8c
color4  #bd93f9
color5  #ff79c6
color6  #8be9fd
color7  #bbbbbb
color8  #555555
color9  #ff5555
color10 #50fa7b
color11 #f1fa8c
color12 #caa9fa
color13 #ff79c6
