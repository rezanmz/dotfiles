# Inkling 2 Mini (Thinking Machines Lab), IQ3_XXS from InterpreticAI — llama.cpp b12608 Vulkan.
#
# The big changes over the previous version of this recipe are the build (b12600 -> b12608, which fixes a real bug),
# the ubatch (64 -> 512, worth ~4x prefill), and the context (192K -> 256K at the same time).  A 2-pass loop override
# was measured, looked like a large win, and was REJECTED because it breaks tool calling — see below.
#
# BUILD.  b12604+ is used, but NOT because it is faster or better here: commit 690b87d fixed loop slots being copied
# before the .scale pass attached, which made passes 2 and 3 run FP4 experts without their per-expert scales.  That fix
# is inert on THIS file — it carries zero `.scale` tensors — and measured PPL is identical across builds (4.7737 on both
# b12600 and b12608 at ub 512).  It matters only for NVFP4-scale checkpoints, and it is why b12600 is not used for any
# scale-carrying variant.
#
# UBATCH 512, not 64.  The previous recipe used ub 64 to shrink a per-head relative-position mask it believed scaled
# with context x ubatch.  Measured on b12608, ubatch has NO effect on decode (31.96 / 31.93 / 31.94 t/s at ub
# 64/128/256) and ub 512 gives the best prefill here, so ub 64 was costing ~4x prefill for nothing.
#
# PASSES = 3, the trained value, and NOT tunable by intent.  The release is trained and post-trained to run the loop
# core three times; every other count is out of distribution.  Measured anyway, on real held-out corpora, to leave no
# ambiguity (fixed-loop checkpoint, loop.count overridden):
#   passes   code PPL            prose PPL           decode
#   1        rejected by the file ("invalid loop core ... 1 passes")
#   2        2.9839 +/- 0.019    6.7561 +/- 0.130   ~42 t/s
#   3        1.7936 +/- 0.009    3.6883 +/- 0.064   ~27 t/s   <- the release, and the best on every row
#   4        2.7575 +/- 0.016    5.7952 +/- 0.102
# 3 passes is the quality optimum as well as the trained point: both 2 and 4 are far worse, and 2 also breaks tool
# calling (1/4 against 4/4).  So no --override-kv is used here, deliberately.
#
# CONTEXT.  Deterministic split at 262144 ctx / ub 512 / q4_0 KV / 3 passes, from the load log:
#   model 8419.92 + KV 2304.00 + SWA KV 56.25 + compute 2269 = 13049 MiB of 16304, leaving ~3.2 GiB to the desktop.
# Measured free VRAM with the browser open (25 chrome processes): 2666 MiB at 256K, 3434 at 192K.  Also measured and
# loadable if more window is wanted: 320K leaves 1294 MiB, 384K leaves 1125 MiB.
#
# TIER.  IQ3_XXS (10.93 GiB, 3.60 BPW; experts 10.09 GiB of it).  Its dense weights are bit-identical to the official
# safetensors and 25/25 hyperparameters match thinkingmachines/Inkling-2-Mini revision 1fb4134, but the experts are a
# RE-quantization of an already-NVFP4 (~4.5 bpw) official checkpoint down to ~3 bpw — double quantization, and that is
# where any quality loss lives.  A higher tier is available at a price, not impossible: lmstudio-community Q4_K_M and
# ggml-org IQ4_NL both carry this arch's correct tensor names, and IQ4_NL fits 192K via --n-cpu-moe 12 (~13644 MiB) —
# but ncmoe counts from layer 0, so 12 swallows loop-core blocks 6..11 whose experts are visited 3x, putting 24 of 48
# layer-visits (half the MoE compute) on the CPU.  Rejected on decode, not on fit.
#
# PUBLISHERS.  Only two of the well-known GGUF publishers produce files this arch loads: lmstudio-community and
# InterpreticAI (both `general.architecture=inkling2_loop` with `blk.N.loop_q_ctrl_down`; lmstudio is the larger and
# more reputable, and is the fallback if this file ever needs replacing).  unsloth (238k downloads), AtomicChat and
# ggml-org's own converter emit `inkling2` + `blk.N.loop_attn_down`, which b12608 rejects — verified by re-probing
# their headers on 2026-11-21 after their repos had been re-uploaded.
#
# ENGINE: Vulkan, and the choice is measured, not assumed.  A full HIP 7 + rocBLAS + hipBLASLt runtime for
# gfx1200/gfx1201 ships with strata (~/.local/share/strata/components/engine/0.1.59-linux-x86_64-hip-rx9070/), and
# llama.cpp's ROCm build detects this card, so ROCm is usable — it is simply not faster.  Same model, same flags, same
# warm harness (first inference discarded, 3 fresh prompts, ctx 32768):
#   ncmoe 6 (this recipe): Vulkan 442 t/s prefill / 25.2 decode | ROCm 428 / 25.3
#   ncmoe 0 (all on GPU):  Vulkan 532 / 27.2                      | ROCm 341 / 20.2
# ROCm also caps the context: its compute-buffer allocation is ~10x Vulkan's, it fails at 64K and tries a 25.5 GiB
# allocation at 256K, so ~49K is its ceiling against 256K here.  Its tools work (4/4), so it is a legitimate fallback
# if the context need ever drops below 49K — just not a speedup.
# llama-bench numbers are NOT comparable across this: bench shows ROCm pp512 1249 against Vulkan 682, but bench never
# receives --n-cpu-moe, so both figures are full-GPU residency and disagree with the server harness above.  Measure with
# the serving path and a warmup, never with bench flags taken from a different command line.
# SGLang and vLLM are NVIDIA-only for this arch; Strata does not support inkling2_loop; Basalt (github.com/jesdga95/
# basalt) requires an NVIDIA Blackwell GPU (sm_120) with CUDA 13 and has no Vulkan or HIP backend at all, so it cannot
# run on RDNA4 regardless of settings.
#
# NOT USED, and why:
# - DSpark drafter: the released dspark-*.gguf carries the padded vocab (markov_w1.weight 201024) against this arch's
#   unpadded 200058, so llama.cpp refuses to load it.
# - n-gram speculation: 27.2 t/s (ngram-simple, 4.9% acceptance) and 25.5 (ngram-map-k) against 27 without.
#
# SAMPLING is the checkpoint's own general.sampling defaults: temp 1.0, top_k 50, top_p 1.0.  No --min-p.
# Writes: none while serving — weights are mmap'd, the same bytes every start, no pack or cache file.
about="Inkling 2 Mini 26B-A3.4B (looped MoE) IQ3_XXS, 256K ctx, vision — llama.cpp Vulkan"
engine=llama
model=$HOME/models/inkling2/Inkling-2-Mini-IQ3_XXS.gguf
mmproj=$HOME/models/inkling2/mmproj-Inkling-2-Mini-F16.gguf
ctx=262144
kv=q4_0
llama_dir=$HOME/.local/opt/llama-b12608
template=""
args="-ngl 999 --n-cpu-moe 6 -fa on -ub 512 -b 2048 -t 8 --parallel 1 --jinja --temp 1.0 --top-k 50 --top-p 1.0"
flags=""
mtp=0
# `llm fetch inkling2` / `llm prune inkling2`
hf=InterpreticAI/Inkling-2-Mini-IQ3_XXS-GGUF
files="Inkling-2-Mini-IQ3_XXS.gguf mmproj-Inkling-2-Mini-F16.gguf"
bytes="11747211584 639348448"
fetch_dir=$HOME/models/inkling2
