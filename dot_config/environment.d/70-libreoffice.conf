# LibreOffice session environment (chezmoi: dot_config/environment.d/70-libreoffice.conf).
#
# SAL_USE_VCLPLUGIN picks the VCL (widget toolkit) backend LibreOffice renders
# its UI with. Without it, LibreOffice auto-detects, and on this machine that
# can land on Qt6/KF6 because qt6-base is installed. The ArchWiki is explicit
# about the consequence: "When on Wayland with the VCL interface set to qt6,
# it can result in lag spikes when scrolling quickly. Setting the environment
# variables to gtk3 seems to be mostly stable."
#
# gtk3 is also the backend that honours the system GTK theme (Dracula) and
# icon theme (Papirus-Dark), so LibreOffice matches the rest of the desktop
# instead of looking like a foreign app. The gtk4 backend is still marked
# experimental upstream, so it is not a candidate.
#
# Read by the systemd-environment-d-generator, so it applies to systemd user
# services and to everything uwsm starts (terminals included). The
# ~/.local/bin/libreoffice wrapper sets the same variable for the current
# session, before the next login picks this file up.
SAL_USE_VCLPLUGIN=gtk3
