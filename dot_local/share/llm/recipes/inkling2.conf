# Inkling 2 Mini (Thinking Machines Lab), IQ3_XXS from InterpreticAI — llama.cpp Vulkan.
# A looped transformer with NO RoPE: `rope.dimension_count = 0` and llama.cpp maps the arch to LLAMA_ROPE_TYPE_NONE.
# Positions come from a learned relative-position bias table (16 x 1024 rows per layer) plus a log-scaled position
# multiplier on the full-attention layers' q and r.  Consequence: --rope-scaling yarn / --rope-scale are accepted but
# inert, and the model needs no extension to reach long context — retrieval was verified at 74K and 171K tokens with
# nothing set.  Do not add a YaRN block here; there are no frequencies to scale.
# 24 physical blocks, 48 cache slots: blocks 6..17 run three times (6+3*12+6) and each visit keeps its own KV and
# short-conv state.  Per token: 5 of every 6 blocks are sliding-window (1024), so only the 8 full-attention slots hold
# full-length KV — 8 slots x 8 kv-heads x (128 key + 128 value) = 16384 values/token, and q4_0 packs 0.5625 bytes
# per value, so 9 KiB/token = 1728 MiB at 192K (measured: 1728.00 MiB, 196608 cells, 8 layers).
# The SWA half is capped by the engine at 1280 cells (56.25 MiB) whatever the context.  The short-conv state keeps the
# last 3 inputs of the widest layer per slot and is negligible: the recurrent R buffer is 3.66 MiB of VRAM for 48
# cache slots.  The ~2.8 GiB of host memory is NOT conv state — it is the CPU-mapped expert weights from
# --n-cpu-moe 6 (13 buffers, 2771 MiB, reported under the Host row, not the GPU row).
# Tier: IQ3_XXS (10.93 GiB, 3.60 BPW) — experts 10.09 GiB of it, 24 iq4_nl + 24 iq3_xxs.  Q4_K_M (16.6 GB) cannot
# fit 16 GB VRAM beside a context at all; the ggml-org IQ4_NL ships a 17 GB file with BF16-layer leftovers.
# --n-cpu-moe 6 offloads the experts of physical blocks 0..5 only.  Those are the prelude, visited once per token
# (6 of 48 visits), so the offload costs ~1/8 of the decode work per byte while freeing 2.52 GiB of VRAM for KV
# (measured: Vulkan0 model buffer 11001.80 MiB with ncmoe 0 against 8419.92 MiB with ncmoe 6).
# Vision stays on the GPU: the mmproj holds ~700 MiB of its worst case there and images are common with this model.
# ub 64 and not 512 or 128: the arch builds a DENSE per-head relative-position mask of 24 heads x n_kv x ubatch in F16,
# so the compute buffer grows linearly with context x ubatch (~0.2 MiB per thousand tokens per ubatch unit, measured):
# 64K/ub 512 = 6636 MiB, 192K/ub 96 = 3759 MiB, 192K/ub 64 = 2567 MiB.  The mask is what caps this machine, not KV:
# at this point the compute buffer already exceeds the whole KV cache (2567 against 1791 + 56).
# Deterministic split at 192K / ub 64 / q4_0 KV, from the load log: model 8419.92 + KV 1728.00 + SWA KV 56.25 +
# compute 2567 = 12771 MiB of 16304, plus the mmproj's own compute buffer; that matches the Vulkan0 row of
# 12778 = 8419 model + 1791 context + 2567 compute.  (2367 is the 256K KV figure — 2304 + 56 — and does not apply here.)
# The desktop baseline is the variable, not the model: 16304 - 12778 leaves 3526 MiB for the compositor and browser
# before any of the runtime's own lazy allocation.  Measured free VRAM with the browser open (24 chrome processes)
# was 3095 MiB; it fell to ~540 MiB when the browser was loading.  Headroom, not a single sample, is what this point
# is chosen for.
# Rejected on measurement (free VRAM sampled with the browser loaded, the worst case): 224K/ub48 left 932 MiB at
# 127 t/s prefill, 224K/ub64 left 348 MiB, 256K/ub64 left 166 MiB, 192K/ub80 left 386 MiB.  224K/ub32 fits (1572 MiB)
# but ub 32 prefill is 127 t/s against 176-209 at ub 64, so the context gained costs more than it is worth.
# Drafters: DSpark is NOT usable — the released dspark-*.gguf carries the padded vocab (markov_w1.weight 201024) while
# this arch expects the unpadded size (200058), so llama.cpp refuses to load it.  n-gram speculation was measured at
# 27.2 t/s (ngram-simple, 4.9% acceptance) and 25.5 t/s (ngram-map-k) against 27 t/s without it: left off.
# Sampling is the model's own: general.sampling temp 1.0, top_k 50, top_p 1.0, min_p 0.0 (the file also says top_k 50,
# so this is not a guess).  Chat template ships in the GGUF and llama.cpp has a dedicated Inkling parser: tool calls
# round-trip through /v1/chat/completions and reasoning arrives as reasoning_content.
# b12600 is the build that added the arch (commit 29b52d3).  Writes: none while serving — weights are mmap'd, the
# started model is the same bytes every time, no pack or cache file.
about="Inkling 2 Mini 26B-A3.4B (looped MoE) IQ3_XXS, 192K ctx, vision — llama.cpp Vulkan"
engine=llama
model=$HOME/models/inkling2/Inkling-2-Mini-IQ3_XXS.gguf
mmproj=$HOME/models/inkling2/mmproj-Inkling-2-Mini-F16.gguf
ctx=196608
kv=q4_0
llama_dir=$HOME/.local/opt/llama-b12600
template=""
args="-ngl 999 --n-cpu-moe 6 -fa on -ub 64 -b 2048 -t 8 --parallel 1 --jinja --temp 1.0 --top-k 50 --top-p 1.0 --min-p 0.0"
flags=""
mtp=0
# `llm fetch inkling2` / `llm prune inkling2`
hf=InterpreticAI/Inkling-2-Mini-IQ3_XXS-GGUF
files="Inkling-2-Mini-IQ3_XXS.gguf mmproj-Inkling-2-Mini-F16.gguf"
bytes="11747211584 639348448"
fetch_dir=$HOME/models/inkling2
