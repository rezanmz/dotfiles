# Linux X11 desktop profile; applied only on Linux.
backend = "glx";
glx-no-stencil = true;
glx-copy-from-front = false;

shadow = false;
no-dnd-shadow = true;
no-dock-shadow = true;

inactive-opacity = 0.70;
active-opacity = 1.0;
frame-opacity = 0.5;
alpha-step = 0.06;
blur-background = true;
blur-background-frame = false;
blur-strength = 4;
blur-background-fixed = false;
blur-background-exclude = [
  "window_type = 'desktop'",
  "class_g = 'zoom'",
  "_NET_WM_WINDOW_TYPE@:32a *= '_NET_WM_WINDOW_TYPE_DIALOG'"
];

fading = true;
fade-delta = 4;
fade-in-step = 0.03;
fade-out-step = 0.03;

corner-radius = 15;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "class_g = 'zoom'",
  "window_type = 'desktop'"
];

mark-wmwin-focused = true;
mark-ovredir-focused = true;
use-ewmh-active-win = true;
detect-rounded-corners = true;
detect-client-opacity = true;
vsync = true;
paint-on-overlay = true;
unredir-if-possible = true;
focus-exclude = [ ];
detect-transient = true;
detect-client-leader = true;

wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 1; focus = true; };
  menu = { fade = true; shadow = false; opacity = 0.7; focus = true; };
  popup_menu = { opacity = 0.7; };
  dropdown_menu = { opacity = 0.7; };
};
