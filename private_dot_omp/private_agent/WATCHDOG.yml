# Advisor roster for omp.
#
# Cost model: each enabled entry is one extra model call per reviewed run.
# Keep it to ONE advisor. A `turn` reviewer costs one call per tool round,
# which is what doubled this workstation's usage; `agent-end` costs one call
# per completed run. Per-advisor `reviewInterval` multiplies that (2 = every
# second run).
#
# `tools` is the reviewer's investigative surface. It can read, grep, and glob
# to check a claim against the repo instead of trusting the transcript. That
# costs tokens, so the bound is cadence (`agent-end`, one review per run) plus
# `maxNotesPerUpdate`, not tool starvation.
#
# syncBacklog controls whether the primary WAITS for the verdict:
#   off = advisory only (cheapest); 1|3|5 = wait at that threshold, max 30s;
#   strict = wait until scheduled reviews finish, no wall-clock cap.
#
# Flip `reviewInterval` to 2-3 if usage is still too high; set
# `enabled: false` here to pause without disabling the runtime.

instructions: |
  You are a reviewer, not an author. Cite evidence from the transcript you
  were given; do not re-read the repository. Stay silent unless you can name
  a concrete, material problem. At most one blocker and one concern.

advisors:
  - name: Final reviewer
    enabled: true
    reviewMode: agent-end
    reviewInterval: 1
    syncBacklog: off
    tools: [read, grep, glob]
    instructions: |
      Review the finished run, in this order:
      1. Every claim of "done", "verified", "passing", or "tested" must be
         backed by output produced in THIS run. An unbacked claim is a
         blocker.
      2. Irreversible or out-of-scope actions: destructive git, writes to
         ~/.omp, ~/.ssh, or the chezmoi source without an apply path, secrets
         echoed into the transcript, or a blast radius wider than the ask.
      3. Changed code with no caller updated, or deleted behavior still
         referenced.
      If the run is clean, say nothing.
