# hyprpaper — wallpaper. Managed by chezmoi (dot_config/hypr/hyprpaper.conf).
#
# hyprpaper 0.8.x syntax: wallpapers are defined in `wallpaper { }` blocks.
# There is no image in the repository — put your own file at
#   ~/.local/share/wallpapers/current.png
# (a plain Dracula-coloured placeholder is shipped there; replace it).
#
# Until an image exists the compositor background colour from
# modules/40-look.lua (Dracula #282a36) shows through, so there is no flash.

splash = false
ipc = true

# Primary monitor.
wallpaper {
    monitor = HDMI-A-1
    path = ~/.local/share/wallpapers/current.png
    fit_mode = cover
}

# Fallback for any other/hot-plugged output.
wallpaper {
    monitor =
    path = ~/.local/share/wallpapers/current.png
    fit_mode = cover
}
