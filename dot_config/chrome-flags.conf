# Chromium/Chrome launch flags. Read by /usr/bin/google-chrome-stable before it
# execs the real binary, so no wrapper script or duplicate .desktop entry needed.
#
# Flag order: --ozone-platform is required for the native Wayland backend;
# Chrome then stops going through XWayland (no scaling blur, real decorations).

--ozone-platform=wayland
--enable-features=WaylandWindowDecorations
