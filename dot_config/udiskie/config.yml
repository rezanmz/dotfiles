# udiskie configuration.
#
# Managed by chezmoi: source is dot_config/udiskie/config.yml.
#
# udiskie listens for udisks2 D-Bus events and mounts removable devices as they
# are plugged in. udisks2 (a system service) does the privileged work; udiskie
# is only the policy layer deciding *what* to mount and when.
#
# YAML is what udiskie prefers (JSON also accepted).
#
# Every key below was checked against udiskie's own option table
# (/usr/lib/python3.14/site-packages/udiskie/cli.py, `option_defaults`), NOT
# against documentation. An unknown key under program_options is simply ignored
# by udiskie, so a typo here fails silently — worth knowing before adding one.
#
# Manual equivalents, for scripting or when the daemon is not running:
#   udisksctl status
#   udisksctl mount -b /dev/sdb1
#   udisksctl unmount -b /dev/sdb1
# ---------------------------------------------------------------------------

program_options:
  # Mount newly plugged devices without asking. Without this udiskie only mounts
  # on explicit request, which is not "plug in and browse".
  automount: true

  # Notify on mount/unmount. A plug is otherwise completely silent, and silence
  # is indistinguishable from "nothing happened".
  notify: true

  # Tray icon, but only while something is mounted ('auto'). Upstream default is
  # false (never show); 'auto' keeps waybar identical when nothing is attached,
  # which matters because the bar already carries eleven modules.
  #
  # Values are true / false / 'auto' — not 'smart'. The CLI flag is --smart-tray,
  # but the config value is the string 'auto'.
  tray: auto

  # Flat menu. The nested one duplicates grouping the tray already provides.
  menu: flat

  # What "browse" opens on a device. yazi is a terminal application, so it needs
  # a terminal host — the same form as the SUPER+E bind in
  # dot_config/hypr/modules/60-binds.lua. Upstream default is xdg-open, which
  # would launch whatever GTK file manager happens to be installed.
  file_manager: 'kitty yazi'

  # Terminal for the tray's terminal action.
  terminal: 'kitty'

  # Password prompt for LUKS devices: udiskie's built-in GUI prompt. This is the
  # default and is left explicit because the alternative ('builtin:console')
  # would prompt on a tty that may not be visible under a Wayland session.
  password_prompt: 'builtin:gui'

  # Remember a LUKS passphrase for N minutes. false = no caching, prompt every
  # time. That is the upstream default and the safer choice: it avoids keeping a
  # decrypted-drive passphrase resident in the udiskie process.
  password_cache: false

# ---------------------------------------------------------------------------
# Per-device overrides.
#
# Matches on device attributes (id_uuid, id_label, id_type, is_luks, ...) and can
# set device-specific options. Left empty deliberately: no device here needs
# special handling, and an empty list is honest about that.
#
# Shape, for when one is needed:
#
# device_config:
#   - id_uuid: 1234-ABCD     # one specific stick
#     options: ro            # mount read-only
#   - id_type: ntfs
#     options: 'uid=1000,gid=1000'
device_config: []
