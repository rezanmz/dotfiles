# Qwen3.8-Flash-Next GSQ-RCO Coder (ISTA-DASLab) on Strata: 29.6 GB native shard (256 of 512 experts per layer,
# 3.5 bpw) + 28.8 GB per-layer n-gram table (mmap'd, one row per token).  Resident arena 23.4 GB before the KV and
# the draft head, so it does not fit 30 GiB RAM beside the desktop.
# experts: setup's auto picks --resident-experts for this pack (arena 23.4 GB) and pins 19.05 GiB of it in RAM,
# which leaves the desktop ~4.4 GiB and makes the engine's own log warn that 96% of the prompt path's lendable slots
# then read from the pack anyway.  --mmap-experts instead: experts read through the OS page cache, ~22 GiB of RAM
# free, and a repeated 5K prompt still comes back in 140 ms.  The run config below holds that flag; llm's setup check
# does not compare it, so an existing config keeps it (re-running strata launch would put --resident-experts back).
# qwen4exp: 48 blocks, every 4th full-attention (2 kv heads, key/value 256) and the rest SSM, so KV at k8v4 is
# ~9 KiB/token = 1.15 GiB at 128K, plus ~0.75 GiB of indexer rows.
# Reserve 3072 MiB measured 1.4 GiB of VRAM free with the desktop busy at 128K (4.59 GiB of expert cache, 2394
# slots); 2048 left only ~300 MiB free and cost nothing in decode speed.  Vision on the GPU reader keeps ~1.4 GB of
# VRAM free as well.
about="Qwen3.8-Flash-Next Coder IQ1_M (ISTA-DASLab, half the experts pruned) — Strata, experts on the SSD"
engine=strata
model=$HOME/models/flashcoder/IQ1_M
ctx=131072
kv=k8v4
vision=gpu
reserve=3072
mtp=1
# the run config Strata keeps for this model (~/.local/share/strata/install/); per recipe, never shared
strata_config=strata-coder-iq1_m.json
# `llm fetch flashcoder` / `llm prune flashcoder`
hf=ISTA-DASLab/Qwen3.8-Flash-Next-GSQ-RCO-Coder-GGUF
files="IQ1_M/Qwen3.8-Flash-Next-GSQ-RCO-IQ1_M-00001-of-00002.gguf IQ1_M/Qwen3.8-Flash-Next-GSQ-RCO-IQ1_M-00002-of-00002.gguf"
bytes="29608446496 28800138432"
fetch_dir=$HOME/models/flashcoder/IQ1_M
