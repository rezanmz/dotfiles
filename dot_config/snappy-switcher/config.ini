# Snappy Switcher configuration.
#
# Managed by chezmoi: source is dot_config/snappy-switcher/config.ini.
# Edit with `chezmoi edit ~/.config/snappy-switcher/config.ini` and apply, or
# edit the source directly and run `chezmoi apply`.
#
# The daemon is started from dot_config/hypr/modules/30-autostart.lua on
# hyprland.start, and the SUPER+Tab bind in 60-binds.lua is the IPC client.
#
# Install note: the binary is user-local (~/.local/bin/snappy-switcher), built
# from source, because installing the AUR package would want root. `make
# install-user` also drops a systemd user unit; that unit is left disabled and
# unused — see 30-autostart.lua for why.
#
# Every available key is documented in the upstream config.ini.example.

[general]

# context = group tiled windows that share a workspace AND app class into one
# stacked card with a count badge. Floating windows are never grouped.
# This is the whole reason to prefer snappy over a plain cycle: the two kitty
# windows this desktop usually runs collapse to one card instead of two
# identical entries.
mode = context

# Follow the focused monitor. Only one output today, but this is the correct
# default the moment a second one is attached.
follow_monitor = true

# Show the workspace ID on each card (e.g. [3]). Together with the SUPER+1..0
# workspace keys in 60-binds.lua this makes a card's destination legible before
# committing to it.
show_workspace_badge = true

# false = preselect the previous window on open, which is the Alt-Tab habit this
# replaces. true would keep the current window selected (index 0) and make the
# first tap a no-op.
sticky_mode = false

# false = LIST special (scratchpad) windows.
# Deliberately the opposite of the shipped default (true). The hyprswitch setup
# this replaces passed --include-special-workspaces for the same reason: a
# window parked on the SUPER+S magic scratchpad must be reachable from the
# switcher, otherwise it can only be recovered by toggling the scratchpad first.
ignore_special = false

# Pinned windows (floating, on every workspace, always-on-top) stay listed.
ignore_pinned = false

[theme]

# Dracula, to match the rest of the desktop. The hyprswitch stylesheet this
# replaces was built on the Dracula palette (--dr-purple #bd93f9), and
# dracula.ini is the same set of values.
name = dracula.ini

# Blur wants something to sample through, so the card, selected card and bundle
# fills are overridden to translucent versions of the theme values. Hyprland
# blurs this layer surface via the rule in dot_config/hypr/modules/70-rules.lua;
# without transparency those rules would be no-ops.
background = #282a36e6
card_bg = #44475ab3
card_selected = #6272a4cc
bundle_bg = #44475ab3

border_width = 1
card_border_width = 2
corner_radius = 15

[layout]

card_width = 145
card_height = 135

card_gap = 10
padding = 10

# 3072x1728 logical pixels (3840x2160 at scale 1.25), so five columns plus gaps
# occupy well under half the width and never wrap off screen.
max_cols = 5

icon_size = 57
icon_radius = 15

error_width = 480
error_height = 160
error_font_size = 13

[icons]

# Installed themes on this machine: Adwaita, Papirus, Papirus-Dark. Papirus-Dark
# is the only dark non-Adwaita set present; hicolor is the guaranteed fallback
# because every application is required to ship its icons there.
theme = Papirus-Dark
fallback = hicolor

show_letter_fallback = true

[font]

# Hack Nerd Font, consistent with the monospace preference in
# dot_config/fontconfig/fonts.conf (Hack Nerd Font Mono -> DejaVu Sans Mono).
family = Hack Nerd Font
weight = Bold

title_size = 10
icon_letter_size = 24
