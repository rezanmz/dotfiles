# mpv configuration, managed by chezmoi.
#
# HDR: the U3225QE runs with cm = "srgb" (see hypr/modules/10-monitors.lua,
# which explains why the wide-gamut presets darken SDR). With an sRGB output
# preset, libplacebo's default target-colorspace-hint=auto decides "target is
# SDR" and tone-maps HDR10 down to 8-bit SDR on the surface. Announcing the
# SOURCE colorspace (PQ/BT.2020) instead lets Hyprland's render:cm_auto_hdr
# switch the output to HDR for the fullscreen window; the surface then
# negotiates VK_COLOR_SPACE_HDR10_ST2084_EXT instead of SRGB_NONLINEAR.
# hint-mode=source is required because the target description is SDR.
# (Upstream: hyprwm/Hyprland discussion #13567.)
#
# HDR is fullscreen-only: render:cm_auto_hdr only engages for a fullscreen
# window, hence fullscreen=yes. Press f to leave fullscreen; SDR output
# returns and the movie is tone-mapped as before.
target-colorspace-hint=yes
target-colorspace-hint-mode=source

# GPU decode + presentation: hevc-vaapi on the RX 9070 XT. The `waylandvk`
# context is what mpv auto-selects under Hyprland; pinned so the log is
# unambiguous.
vo=gpu-next
hwdec=vaapi
gpu-context=waylandvk

# 23.976 fps material on the 120 Hz panel: resample audio to the display
# rate so frames land on whole refresh intervals (5:1) without frame drops.
video-sync=display-resample

profile=high-quality
fullscreen=yes
