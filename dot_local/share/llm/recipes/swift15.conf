# Swift 1.5 Qwen3.8-27B IQ3_XXS — llama.cpp b12079 Vulkan, RX 9070 XT.
# 96K ctx with q4_0 KV holds 14.3 GiB of VRAM, leaving ~2 GiB for the desktop (measured 2026-11-03).
# The chat template is patched: upstream Swift 1.5 raises a 500 for reasoning_effort outside xhigh/medium/low.
about="Swift 1.5 27B IQ3_XXS — 14.3 GiB at 96K"
engine=llama
model=$HOME/models/swift15/IQ3_XXS-mtp.gguf
ctx=98304
kv=q4_0
llama_dir=$HOME/.local/opt/llama-b12079
template=$HOME/.local/opt/llama-b12079/swift15-chat-template.jinja
args="-ngl 99 -fa on -ub 1024 -b 2048 -t 8 --parallel 1 --cache-ram 16384 --jinja --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 0.0 --repeat-penalty 1.0"
flags=""
