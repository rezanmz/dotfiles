# hypridle — lock and suspend timers. Managed by chezmoi
# (dot_config/hypr/hypridle.conf). Runs as the hypridle systemd user unit.

general {
    lock_cmd = hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'

    # Two different inhibitors are in play, and they are set independently.
    #
    # ignore_dbus_inhibit: whether hypridle offers the org.freedesktop.ScreenSaver
    # interface, so that apps can ask it to hold off the idle timers (a video
    # player asking not to be interrupted). Leave this at false so those apps
    # still work — it costs nothing, and it is what makes fullscreen video not
    # get locked out from under you.
    ignore_dbus_inhibit = false

    # ignore_systemd_inhibit: whether hypridle honours systemd's "block idle"
    # inhibitors. A block-idle inhibitor makes hypridle hold ALL of its timers
    # back, including the suspend one — the machine then never sleeps on idle
    # for as long as the inhibitor is alive.
    #
    # This is set to true on purpose. An agent session holding a block-idle
    # inhibitor would otherwise silently stop the machine from ever sleeping,
    # which is exactly the sort of thing that looks like a hardware fault.
    # The screensaver inhibit (the one that matters for video) is the D-Bus
    # one above, and that still works.
    ignore_systemd_inhibit = true
}

# Dim the panel before locking.
listener {
    timeout = 240
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Lock the session.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Suspend. This machine is a desktop with no battery.
#
# 20 minutes: long enough that a break from the desk does not suspend, short
# enough that the machine spends most of its day asleep rather than awake
# and burning power. The screen is already off at 4 minutes and the session
# is already locked at 5, so by the time this fires nothing is visible.
#
# Suspend rather than hibernate: the resume is ~1s instead of ~15s, and the
# machine draws a fraction of the power.
#
# This is a plain suspend, and that is deliberate. The long absences are
# handled by the power button, which logind maps to suspend-then-hibernate
# (see the sleep policy in README.md): it idles in RAM first and only writes
# RAM to disk if the machine is still asleep 45 minutes later.
#
# This timer does NOT use that chain, because hypridle's own timer is
# cancellable: if the user comes back, the suspend is cut short. A hibernation
# triggered from here would have to be written to disk even for a five-minute
# break, and the image is only cleared at the next reboot.
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
