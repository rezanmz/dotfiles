# Custom model providers for omp (ModelRegistry reads providers: here).
# Managed by chezmoi — no secrets in this file. Keys live in ~/.omp/agent/.env
# (NINE_ROUTER_API_KEY, OPENROUTER_API_KEY), which omp loads automatically.
#
# 9router: route opencode-go SOURCE models (not hand-built combos) through the
# self-hosted router. Every id here is `ocg/<slug>` — the prefix is mandatory;
# a bare slug 404s with 'No active credentials for provider: openai'.
#
# Verified 2026-10-17 against https://opencode.ai/zen/go/v1/models (37 live ids):
#   34 route on /v1/chat/completions; claude-haiku-5-5 + minimax-m2.7 need
#   /v1/messages (api: anthropic-messages) and 400 ModelProtocolUnsupported
#   on the chat lane; gemini-4-argon-contributor is dead on every lane and is
#   intentionally omitted.
#
# `auth: apiKey` is REQUIRED here. Without it, omp assumes OAuth shaping on the
# anthropic lane and injects Claude Code identity + context_management, which
# the upstream rejects with 400 'context_management: Extra inputs are not permitted'.
#
# contextWindow/maxTokens come from 9Router's own capability block, falling back
# to models.dev; cost is per 1M tokens (cacheRead/cacheWrite inferred at 10%/125%
# of input where the upstream publishes no cache tier).
providers:
  9router:
    baseUrl: https://router.reza.network/v1
    api: openai-completions
    authHeader: true
    apiKey: NINE_ROUTER_API_KEY # resolved from env / ~/.omp/agent/.env
    auth: apiKey # plain API-key shaping; do NOT let omp use OAuth shaping
    compat:
      supportsReasoningEffort: true
    models:
      - id: ocg/beam-free
        name: beam-free — free, unlimited, fastest
        reasoning: true
        input: [text]
        cost: {input: 0, output: 0, cacheRead: 0, cacheWrite: 0.0}
        contextWindow: 1048576
        maxTokens: 131072
      - id: ocg/claude-haiku-5-5
        name: claude-haiku-5-5 — anthropic lane; rejects thinking/output_config
        api: anthropic-messages
        reasoning: true
        input: [text, image]
        cost: {input: 0.1, output: 0.5, cacheRead: 0.01, cacheWrite: 0.125}
        contextWindow: 1000000
        maxTokens: 128000
      - id: ocg/deepseek-v4-pro
