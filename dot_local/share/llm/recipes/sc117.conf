# Qwen3.8-Flash-Next GSQ-RCO-abliterated Q2_0 (SC117) on Strata: 38.0 GB weights shard (34 GB of experts, streamed
# off the SSD) + 28.8 GB n-gram table (mmap'd, one row per token).  The only tier that fits 16 GB VRAM + 30 GiB RAM.
# Vision on the GPU reader costs 700 MiB of reserve and ~1-1.4 GB of the expert cache; vision=cpu gives ~1 GB back.
# Reserve: 2048 MiB keeps ~1.9 GiB of VRAM free for the desktop; 3072 is the engine's own advice if the desktop
# crashes after a start.
about="Qwen3.8-Flash-Next Q2_0 abliterated — Strata, experts on the SSD"
engine=strata
model=$HOME/models/sc117-flash-next/Q2_0
ctx=131072
kv=k8v4
vision=gpu
reserve=2048
mtp=1
# the run config Strata keeps for this model (~/.local/share/strata/install/); per recipe, never shared
strata_config=strata-q2_0.json
# `llm fetch sc117` / `llm prune sc117`
hf=SC117/Qwen3.8-Flash-Next-GSQ-RCO-abliterated-GGUF
files="Q2_0/Qwen3.8-Flash-Next-GSQ-RCO-abliterated-Q2_0-00001-of-00002.gguf Q2_0/Qwen3.8-Flash-Next-GSQ-RCO-abliterated-Q2_0-00002-of-00002.gguf"
bytes="38021379872 28800138432"
fetch_dir=$HOME/models/sc117-flash-next/Q2_0
