# Custom model providers for omp (ModelRegistry reads providers: here).
# Managed by chezmoi — no secrets in this file. The NINE_ROUTER_API_KEY
# value lives in ~/.omp/agent/.env (local, untracked, alongside the auth
# store), mirroring the key already held in opencode's auth.json for the
# opencode CLI.
#
# Limits are the MINIMUM across each combo's members (a request can land
# on any member, so omp must not plan beyond the weakest):
#   chat:  deepseek-flash, glm-5.3-flash (both 1M ctx, vision, out>=131K)
#          + openrouter twins
#   smart: glm-5.3 (1M, NO vision, 131K out), grok-4.6 (500K, vision),
#          qwen3.8-max (1M, vision, 131K out) + openrouter twins
# Vision/designer roles through smart lose images while glm-5.3 leads the
# combo; reorder members or use chat for those to gain real vision.
providers:
  9router:
    baseUrl: https://router.reza.network/v1
    api: openai-completions
    authHeader: true
    apiKey: NINE_ROUTER_API_KEY # resolved from env / ~/.omp/agent/.env
    compat:
      supportsReasoningEffort: true
    models:
      - id: chat
        name: 9Router chat (everyday flash combo)
        reasoning: true
        input: [text, image]
        contextWindow: 1000000
        maxTokens: 131072
      - id: smart
        name: 9Router smart (heavy reasoning combo)
        reasoning: true
        input: [text]
        contextWindow: 500000
        maxTokens: 131072
