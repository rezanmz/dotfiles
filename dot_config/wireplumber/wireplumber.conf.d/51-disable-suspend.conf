# Keep ALSA sinks awake.
#
# pipewire powers a sink down after a few seconds of silence, and the first sound
# after that silence is the one that has to wake it — which it cannot do while it
# is resuming. A short sound is therefore swallowed whole: the volume feedback
# tick (about 100 ms) was inaudible for exactly that reason, while a long sound
# played fine.
#
# 0 seconds means never suspend. The cost is an audio device that stays powered
# when idle instead of going to sleep.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.*"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
