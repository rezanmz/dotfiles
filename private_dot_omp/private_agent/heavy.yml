# Heavy-task model profile: pricier/smarter models for hard work.
# Usage: omp --config ~/.omp/agent/heavy.yml   (add an `omp-heavy` alias if wanted)
# Daily-driver profile is untouched; only roles listed here are overridden.
# smol/tiny/commit stay cheap on purpose.
#
# Ported 2026-10-18: every `opencode-go/*` id below resolved to nothing on this
# machine (no such provider; see the note in config.yml). Ids are now the
# 9Router lane from models.yml (`ocg/<slug>`), with OpenRouter twins as backup.
# Rationale for the picks (independent AA data, 2026-09-04):
# - kimi-k3: best measured coding (AA Coding 76.2, SWE-bench 93.4 open-weight), Int ~60, $3/$15
# - muse-spark-1.3-contributor: highest measured Int (61-62), same weights as full muse 1.3,
#   $0.10/$0.20 but 60 RPM / 2.1M TPM caps -> full muse tier on openrouter is fallback #1
modelRoles:
  default: 9router/ocg/kimi-k3:max
  slow: 9router/ocg/muse-spark-1.3-contributor:xhigh
  smol: 9router/ocg/mimo-v2.6-flash:minimal
  vision: 9router/ocg/muse-spark-1.3-contributor:high
  plan: 9router/ocg/muse-spark-1.3-contributor:xhigh
  designer: 9router/ocg/muse-spark-1.3-contributor:high
  commit: 9router/ocg/mimo-v2.6-flash:minimal
  tiny: 9router/ocg/mimo-v2.6-flash:minimal
  task: 9router/ocg/kimi-k3:max
  advisor: 9router/ocg/muse-spark-1.3-contributor:xhigh

retry:
  fallbackChains:
    default:
      - openrouter/meta/muse-spark-1.3:high
      - openrouter/moonshotai/kimi-k3:max
    slow:
      - openrouter/meta/muse-spark-1.3:xhigh
      - openrouter/moonshotai/kimi-k3:max
    plan:
      - openrouter/meta/muse-spark-1.3:xhigh
      - openrouter/moonshotai/kimi-k3:max
    smol:
      - 9router/ocg/hy3:minimal
      - openrouter/xiaomi/mimo-v2.6-flash:minimal
    task:
      - openrouter/meta/muse-spark-1.3:high
      - openrouter/moonshotai/kimi-k3:max
    vision:
      - openrouter/meta/muse-spark-1.3:high
      - 9router/ocg/gpt-5.6-luna:high
    designer:
      - openrouter/meta/muse-spark-1.3:high
      - 9router/ocg/gpt-5.6-luna:high
    commit:
      - openrouter/xiaomi/mimo-v2.6-flash:minimal
    tiny:
      - openrouter/xiaomi/mimo-v2.6-flash:minimal
    advisor:
      - openrouter/meta/muse-spark-1.3:xhigh
      - openrouter/moonshotai/kimi-k3:high
