# LibreOffice session environment (chezmoi: dot_config/environment.d/70-libreoffice.conf).
#
# SAL_USE_VCLPLUGIN picks the VCL (widget toolkit) backend LibreOffice renders
# its UI with. Without it, LibreOffice auto-detects, and on this machine that
# lands on the Qt6/KF6 backend because qt6-base is installed. The ArchWiki is
# explicit about the consequence: "When on Wayland with the VCL interface set
# to qt6, it can result in lag spikes when scrolling quickly. Setting the
# environment variables to gtk3 seems to be mostly stable."
#
# gtk3 is also the backend that honours the system GTK theme (Dracula) and the
# Papirus-Dark icon theme, so LibreOffice matches the rest of the desktop
# instead of looking like a foreign app. The gtk4 backend is still marked
# experimental upstream, so it is not a candidate.
#
# NOTE ON FRACTIONAL SCALING (this display is 3840x2160 at scale 1.5)
#
# The GTK3 backend on native Wayland is known to render blurry document text
# at some fractional scale factors (tdf#164232). If that shows up here, the
# fallbacks are, in order of preference:
#
#   1. A different VCL backend. The gtk4 backend avoids the blur, and
#      QT_SCALE_FACTOR_ROUNDING_POLICY=PassThrough keeps Qt6 from rounding
#      1.5 to an integer factor. Neither is the default here, so switching is
#      a deliberate edit, not a default.
#
#   2. XWayland with xwayland:force_zero_scaling=true. Do NOT expect this to
#      be crisp today: with force_zero_scaling off, Hyprland gives XWayland a
#      2560x1440 logical screen and upscales the X11 buffer 1.5x at composite
#      time, which is the blurry path. Turning force_zero_scaling on makes
#      XWayland use the full 3840x2160, so the X11 buffer is 1:1 with the
#      panel and the text is genuinely sharp -- at the cost of tiny UI
#      elements, and it affects every XWayland app (Chrome, Thunderbird),
#      not just LibreOffice.
#
# Read by the systemd-environment-d-generator, so it applies to systemd user
# services and to everything uwsm starts (terminals included). The
# ~/.local/bin/libreoffice wrapper and the ~/.local/share/applications
# desktop overrides set the same variable for paths that do not go through
# the generator.
SAL_USE_VCLPLUGIN=gtk3
