# Qwen3.8-27B-pi-adapted (harness-hub), netprojects IQ2_M merge + MTP — llama.cpp b12608 Vulkan.
#
# The adapter: a LoRA (r 32, alpha 64, scale 2.0) trained with AsyncGRPO inside the pi coding agent on
# Terminal-Bench / SWE-bench Pro tasks, thinking OFF, to be the model behind pi.  On the authors' own harness it took
# SWE-bench Pro (hard 51) 39.2 -> 64.7 and Terminal-Bench 2.1 39.5 -> 55.8, with under half the turns and 4.5x fewer
# generated tokens than the base model thinking at xhigh.  The numbers are the BF16 adapter served by vLLM; the GGUF
# has not been re-evaluated.
#
# THINKING: on, at omp's level, on the user's instruction (2026-11-21).  The adapter was trained and evaluated thinking
# off, and its card recommends staying off: thinking buys 64.7 -> 74.5 on SWE-bench Pro (not significant on 51 tasks)
# and nothing on Terminal-Bench, for ~4-5x the tokens per task and 3x the calls.  On this card, 63 t/s and up to 32k
# output tokens per call means minutes per model call in that mode.  think=auto rather than on: on would pin
# --reasoning on and ignore the client's effort; auto lets omp send reasoning_effort, which the patched template maps.
# Reverting to the trained configuration is one line: think=off.
#
# qwen35: 65 blocks, every 4th full-attention (4 kv heads, key/value 256) and the rest SSM, so 16 attention layers hold
# KV and the other 49 keep a fixed recurrent state.  KV at q4_0 is 18 KiB/token = 2.25 GiB at 128K.
# Fixed costs on top of the weights: 598 MiB SSM state (R f32 22.5 + S f32 576, 65 layers, 1 cell), ~1.3 GiB Vulkan
# compute buffer at ub 512, 40 MiB nextn buffer for MTP.
# Weights: this file is 9.54 GiB total, 9.52 GiB of tensors — ffn gate/up/down 5.32 GiB at IQ2_S, attn_qkv 1.32 GiB
# at Q4_K, output 0.81 GiB Q5_K, token_embd 0.51 GiB IQ3_S, and the MTP layer (blk.64, nextn_predict_layers=1) inside
# this file.
#
# TIER: IQ2_M, chosen by the user between two measured options.  Loaded on this card (16 GB, Chrome open holding
# ~2.2 GiB), engine's own breakdown, same flags:
#   IQ3_XXS 80K, resident ......... decode 54.9 t/s, prefill 1113 t/s, 987 MiB free, 91.5% top-1 vs Q8_0
#   IQ2_M  128K, resident ......... decode 63.6 t/s, prefill 1223 t/s, 954 MiB free, 89.6% top-1 vs Q8_0
#   IQ3_XXS 128K, 9 FFN on CPU .... decode 15.6 t/s, prefill 1010 t/s, 685 MiB free  <- REJECTED
# 128K is the context harness-hub evaluated this adapter at (their pi runs never reached 131072 tokens), so the window
# and the tier were traded against each other; the evaluated window won.  The CPU-offload route is rejected because
# spilling 9 of 64 FFN layers costs 4x decode — worse than a whole tier of weights.
# Q3_K_M (12.57 GiB) and Q4_K_M (15.66 GiB) are rejected on fit: neither holds 128K beside the desktop.
# The mradermacher i1 files are rejected on provenance: their imatrix was built on 400 entries from
# "imatrix-training-full-3", a dataset with no stated relation to pi's task distribution, while netprojects calibrated
# on the model's own outputs and published the per-tier numbers above.
#
# PROVENANCE (audited 2026-11-21, because the card's own claims are not evidence):
#  - netprojects merged harness-hub's adapter (rev e786f84, identical adapter_model.safetensors LFS oid to main) into
#    Qwen/Qwen3.8-27B (rev 3756181) as W + 2.0*B@A in fp32 -> bf16.  Verified: prithivMLmods' independent bf16 merge is
#    99.9997% bit-identical to W + 2.0*(B@A) on blk.3.attn_k (327679/327680 elements), so the merge formula and scale
#    are right; and this repo's Q8_0 file's per-block scales match that MERGED tensor on 40960/40960 blocks against
#    40734/40960 for the base model — i.e. this publisher quantized the merged weights, not the base.
#  - This file's header matches the base: 866 tensors, same vocab (248320) and merges, byte-equal F32 norms on
#    unadapted tensors, and blk.64 carries the nextn tensors.  Embedded chat template is byte-equal to the adapter card's.
#  - quantize.imatrix.* metadata is present but the calibration corpus is only named "imatrix-calib.txt", so the
#    per-tensor mix here cannot be reproduced.  Recorded, not trusted.
#  - sha256 verified against the Hub LFS oid on download: 435bb2b6… for this file, bf489e44… for the mmproj.
#
# Template: upstream raises 500 for any reasoning_effort outside xhigh/medium/low, and omp sends its own aliases
# (minimal/high/max/auto), so the patched copy in chezmoi (templates/pi27.jinja, one hunk) is used; all six aliases were
# exercised through /v1/chat/completions and none 500s.  The patch maps minimal/none/off/low -> low, medium -> medium,
# everything else -> xhigh, so omp's "max" lands on the model's own top rung instead of a 500.  With think=off the
# server instead sends enable_thinking=false (verified via /apply-template on b12608 and b12079) and the template opens
# an empty <think></think> block, ignoring the client's effort.
#
# MEASURED on this box 2026-11-21 (16 GB card, Chrome holding ~2.2 GiB, one model at a time, engine's own breakdown):
#   128K, ub 512, vision CPU ..... weights 9237 + KV 2906 + compute 280, 954 MiB free of 16304 after load
#   a 39K-token prompt .......... no re-read, no write: rchar/wchar/read_bytes/write_bytes all unchanged across it
#   RSS 3.7 GiB, VmSwap 61 MiB ... the 13.6 GiB of zram in use belongs to the desktop, not to this model
# MTP: --spec-type draft-mtp against blk.64; measured here at 0.37-0.59 draft acceptance per request (mean len 2.1-2.8)
# against the publisher's 72-76% on Apple silicon.  Accepted drafts are free tokens, so it stays on.
# Sampling is the checkpoint's own: temp 1.0, top_k 20, top_p 0.95 (publisher used 0.8/1.0 in its evaluation).
# Writes: none while serving — weights are mmap'd, the same bytes every start, no pack and no cache file.
about="Qwen3.8-27B-pi-adapted (pi coding agent) IQ2_M, 128K, thinking on, vision + MTP — llama.cpp Vulkan"
engine=llama
model=$HOME/models/pi27/Qwen3.8-27B-pi-IQ2_M.gguf
mmproj=$HOME/models/pi27/mmproj-Qwen3.8-27B-pi-F16.gguf
ctx=131072
kv=q4_0
llama_dir=$HOME/.local/opt/llama-b12608
template=$HOME/.local/share/llm/templates/pi27.jinja
args="-ngl 99 --no-mmproj-offload -fa on --image-min-tokens 1024 -ub 512 -b 2048 -t 8 --parallel 1 --cache-ram 16384 --jinja --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 0.0 --repeat-penalty 1.0"
flags=""
think=auto          # see THINKING above; think=off restores the trained configuration
# The judge is joey-1 (baselabs), a 2B decision model served by qev on the CPU at 127.0.0.1:8078, registered as a
# native `typesafe` provider: auto-thinking resolves the effort from a calibrated /v1/systemone classification instead
# of a chat reply.  It runs out of process, so a 1.07 s decision never competes with the GPU slot.
# Verified here 2026-11-21 through omp's own path (session jsonl, provider=joey):
#   "say hi" -> low | "flaky test, no repro, find the race" -> xhigh
# A profile MUST set defaultThinkingLevel to a concrete level (max), not `auto`: measured, with `auto` the classifier is
# never engaged and no /v1/systemone request is sent, while the level still changes — so the profile looks like it is
# being judged when it is not.  Verified by proxying the judge port and counting requests.
# Known bias, measured on a 9-case matrix: it never chose medium (0/2 on medium cases, both routed low), and it
# under-rated a zero-downtime migration (high at confidence 0.02, wanted xhigh).  Extremes are reliable, the middle
# tier is not — for a design-choice turn that matters, raise it by hand with /thinking.
judge_url=http://127.0.0.1:8078
judge_model=joey-1
profiles="offline localwork"
mtp=1
# `llm fetch pi27` / `llm prune pi27`
hf=netprojects/Qwen3.8-27B-pi-adapted-GGUF
files="Qwen3.8-27B-pi-IQ2_M.gguf mmproj-Qwen3.8-27B-pi-F16.gguf"
bytes="10243577504 927606816"
fetch_dir=$HOME/models/pi27

