# SC117 profile models: ONLY the local Strata server on 127.0.0.1:8080. No remote provider is declared.
#
# Qwen3.8-Flash-Next GSQ-RCO-abliterated Q2_0 (SC117): 48 layers, 512 experts / 10 per token, 262K native context.
# 131072 is the context this card + RAM afford with a 2 GiB reserve (k8v4 KV: 1.62 GiB; see ~/.local/bin/sc117).
# Pictures: the server takes OpenAI image_url parts (base64, http(s) or a local path) and encodes them with the
# model's mmproj — on the CPU here, ~1.7 s a picture.
providers:
  strata-local:
    baseUrl: http://127.0.0.1:8080/v1
    api: openai-completions
    authHeader: true
    apiKey: none
    auth: apiKey
    models:
      - id: sc117
        name: sc117 — Qwen3.8-Flash-Next abliterated Q2_0, local
        reasoning: true
        input: [text, image]
        cost: {input: 0, output: 0, cacheRead: 0, cacheWrite: 0}
        contextWindow: 131072
        maxTokens: 32768
