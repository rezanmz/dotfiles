# hypridle — lock and suspend timers. Managed by chezmoi
# (dot_config/hypr/hypridle.conf). Runs as the hypridle systemd user unit.

general {
    lock_cmd = hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'

    # Two different inhibitors are in play, and they are set independently.
    #
    # ignore_dbus_inhibit: whether hypridle offers the org.freedesktop.ScreenSaver
    # interface, so that apps can ask it to hold off the idle timers (a video
    # player asking not to be interrupted). Leave this at false so those apps
    # still work — it costs nothing, and it is what makes fullscreen video not
    # get locked out from under you.
    ignore_dbus_inhibit = false

    # ignore_systemd_inhibit: whether hypridle honours systemd's "block idle"
    # inhibitors. A block-idle inhibitor makes hypridle hold ALL of its timers
    # back, including the suspend one — the machine then never sleeps on idle
    # for as long as the inhibitor is alive.
    #
    # This is set to true on purpose. An agent session holding a block-idle
    # inhibitor would otherwise silently stop the machine from ever sleeping,
    # which is exactly the sort of thing that looks like a hardware fault.
    # The screensaver inhibit (the one that matters for video) is the D-Bus
    # one above, and that still works.
    ignore_systemd_inhibit = true
}

# Dim the panel before locking.
listener {
    timeout = 240
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# Lock the session.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Suspend is NOT a listener here any more.
#
# The idle menu (Quickshell: dot_config/quickshell/IdleGuard.qml + panels/Idle.qml)
# owns "suspend after N minutes of inactivity", because hypridle reads its
# timeouts from this static file and that setting is adjustable from the panel and
# persisted to ~/.local/state/quickshell/idle.json. The shell watches the same
# ext-idle-notify events hypridle does, so holds, media playback and cinema mode
# suppress it exactly the same way.
#
# It still goes through suspend-then-hibernate: plain suspend would hold RAM
# powered indefinitely, and the chain idles in memory first and only writes RAM to
# disk if the machine is still asleep after HibernateDelaySec (45 minutes, in the
# sleep policy). Every suspend path on this machine uses the chain.
#
# Blank (4 min) and lock (5 min) above are unchanged, so by the time the suspend
# timer fires nothing is visible anyway.

