# Inkling 2 Mini (Thinking Machines Lab) 26B-A3.4B looped MoE — unsloth UD-IQ3_XXS (root `inkling2` layout),
# llama.cpp Vulkan fork d99ce33 + tokenizer patch + RDNA4 FA split-k. 256K context, DSpark, vision.
#
# GPU: Radeon RX 9070 XT (Vulkan reports XT; lspci is the Navi 48 9070/XT/GRE family), gfx1201, 16 GB, RADV.
#
# WHY THIS BUILD: mainline 8d60873 measured 427 t/s prefill / 38.1 t/s decode at 32K, nc5, q4_0 KV. This fork
# measures 620 / 51.4 at 32K, nc6 (fused Inkling ops, indexed-bias flash attention, prompt-cache reuse), and
# 675 t/s prefill / 53.7 t/s decode on a 2,365-token prompt with DSpark. Published #32773 numbers (47.6 -> 80.2
# t/s code) are an upper bound: RX 9070 XT 16 GB, but a 12.1 GB IsValorum target at 184K and n_max 4. Here n_max 2
# wins on both axes: code 63.0-65.0 t/s (78-82% acceptance), chat/reasoning 48.1-51.5 (47-54%), baseline 45.5.
#
# FILE: unsloth/Inkling-2-Mini-GGUF root `Inkling-2-Mini-UD-IQ3_XXS.gguf`, arch `inkling2`. The fork does not load
# the Mainline_Support `inkling2_loop` file; the root file is the same 11.66 GB IQ3_XXS quant, imatrix-calibrated.
# Drafter: dspark-Inkling-2-Mini-Q8_0.gguf (402,278,560 B, sha256 2ec78510...), q4_0 draft KV.
#
# DSPARK: n_max 2 keeps draft acceptance high. n_max 4 lost 9% on thinking-heavy chat (41.5 vs 45.6) while n_max 2
# gained 5-13% there and 38-43% on code. At the recipe's temp 1.0/top-k 50: code 63.0 (78% accept), chat 48.1 (47%).
#
# FA SPLIT-K: RDNA4 long-KV decode (N=1, KV>=4096) uses shader_core_count*8 instead of upstream *2.
# 32K tg64 49.14 -> 51.16 (+4.1%). With DSpark at 9.3K: 73.88 -> 74.48 (+0.8%), output bit-identical.
# The reduction order can flip near-tie tokens without speculation (one sample: q2_k -> q2_K); set
# GGML_VK_FA_SPLIT_K_MULT=2 to restore the upstream order. Prefill (N>1) is unchanged.
#
# PLACEMENT: --n-cpu-moe 6 offloads layers 0-5, all prelude/single-pass. nc7 would offload looped blk.6 and, on
# Vulkan, inflate the compute buffer ~0.9 -> 7.7 GiB (#32777); that is why the old Q3_K_XL nc8-10 attempt ran slow.
# VRAM at 256K/nc6/DSpark: ~14.9 GiB of 16.3 GiB visible, ~1.4 GiB free with the desktop. The mmproj runs on CPU
# (--no-mmproj-offload) to keep that reserve. Vision verified on a rendered serial (SN-4721); tools 4/4.
#
# TOKENIZER: the fork lacked upstream #32799; one line (`ignore_merges = true` for inkling2) is patched in. It
# tokenizes `def f(*args, **kwargs):` as 10 tokens, not 12.
#
# NOT USED / REJECTED, measured today unless stated:
# - mainline #32218 DSpark: expects markov_w1 [256,200058]; the shipped drafter is [256,201024] and has no
#   markov_w2, so it cannot load this drafter.
# - PR #32773 branch (0a9105d): loads the padded w1, but its head expects a 3*n_embd (6912) state while the
#   speculative code passes n_embd (2304); measured 27.2 t/s / 32% acceptance, i.e. a loss.
# - mainline + #32752 (chunked mask): 386.6 pp / 37.8 tg at 32K vs 427.3 / 38.1 for plain 8d60873; dropped.
# - Mainline_Support `inkling2_loop` file: unknown arch to this fork. Root file only.
# - Q3_K_XL: better KLD but needs loop-aware -ot; not pursued after the fork's prefill/decode win.
#
# Writes: none while serving — weights are mmap'd, the same bytes every start, no pack or cache file.
about="Inkling 2 Mini 26B-A3.4B (looped MoE) UD-IQ3_XXS, 256K ctx, DSpark, vision — llama.cpp Vulkan fork"
engine=llama
model=$HOME/models/inkling2/Inkling-2-Mini-UD-IQ3_XXS.gguf
mmproj=$HOME/models/inkling2/mmproj-F16.gguf
ctx=262144
kv=q4_0
llama_dir=$HOME/.local/opt/llama-fork
template=""
draft=$HOME/models/inkling2/dspark-Inkling-2-Mini-Q8_0.gguf
draft_n=2
draft_kv=q4_0
args="-ngl 999 --n-cpu-moe 6 -fa on -ub 512 -b 2048 -t 8 --parallel 1 --jinja --temp 1.0 --top-k 50 --top-p 1.0 --no-mmproj-offload"
flags=""
mtp=0
think=auto
# `llm fetch inkling2` / `llm prune inkling2`
hf=unsloth/Inkling-2-Mini-GGUF
files="Inkling-2-Mini-UD-IQ3_XXS.gguf dspark-Inkling-2-Mini-Q8_0.gguf mmproj-F16.gguf"
bytes="11663309504 402278560 639348160"
fetch_dir=$HOME/models/inkling2
