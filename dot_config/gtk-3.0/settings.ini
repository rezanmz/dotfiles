# GTK 3 settings — Dracula with Papirus icons.
# Managed by chezmoi (dot_config/gtk-3.0/settings.ini).
# Note: this file is parsed by GKeyFile, which accepts only # comments.
# Chromium/Chrome reads GTK prefs, and toolkits pick them up in Wayland
# sessions because there is no XSettings daemon.

[Settings]
gtk-theme-name=dracula
gtk-icon-theme-name=Papirus-Dark
gtk-font-name=Noto Sans 11
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
gtk-application-prefer-dark-theme=1
gtk-enable-event-sounds=1
gtk-enable-input-feedback-sounds=0
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
gtk-decoration-layout=:minimize,maximize,close
