<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Fontconfig. Managed by chezmoi (dot_config/fontconfig/fonts.conf).
     Persian/Arabic text prefers Vazirmatn; the rest falls back to Noto/DejaVu. -->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Vazirmatn</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>DejaVu Serif</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>Hack Nerd Font Mono</family>
      <family>DejaVu Sans Mono</family>
    </prefer>
  </alias>

  <!-- Persian/Arabic script: B Nazanin when installed locally (never vendored),
       then Vazirmatn before the Noto Arabic fallbacks. Scoped to Persian text
       rather than prepended to every pattern, so Latin rendering is unaffected. -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>fa</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>B Nazanin</string>
    </edit>
    <edit name="family" mode="prepend" binding="strong">
      <string>Vazirmatn</string>
    </edit>
  </match>
</fontconfig>
