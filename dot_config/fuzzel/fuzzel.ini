# fuzzel — Wayland-native launcher. Managed by chezmoi.
#
# SUPER+D        application launcher (drun mode)
# SUPER+SHIFT+T  window switcher (--dmenu fed by a window list)
# Also driven with --dmenu by dot_local/bin/clipboard-pick and exit-menu.
#
# Schema reference: fuzzel.ini(5). Three things that are easy to get wrong:
#   - the border COLOUR lives in [colors], not [border]
#   - `terminal` is REQUIRED to launch Terminal=true entries (htop, vim, yazi),
#     because fuzzel refuses to start them without it
#   - `dpi-aware=no` is correct here: font size is multiplied by the monitor
#     scale factor (1.25), which is what makes the text physically larger

[main]
# Sized for a 31.5" 4K panel at scale 1.25. The window is in CHARACTER units for
# width and ROW units for lines, so both must grow for the UI to feel right;
# the previous 38 chars / 10 lines rendered only 373x241 logical px, about 12%
# of a 3072x1728 desktop.
font=Hack Nerd Font:size=13
dpi-aware=no

# NOTE: gamma-correct-blending is NOT set. Arch's fuzzel is a cairo build, and
# cairo cannot provide the 16-bit buffers it needs, so fuzzel logs
# "disabling; not supported in cairo-enabled builds" and ignores it.

lines=8
width=46

# Breathing room. Defaults are cramped for a large panel.
horizontal-pad=28
vertical-pad=20
inner-pad=12

# Explicit row height so 13pt text is not squeezed by font metrics.
line-height=28
letter-spacing=0.2

# NOT set here: this is [main], so it would also hide the list for every
# --dmenu caller (exit-menu, clipboard-pick, notif-history, dunst). Those are
# browsing tasks whose entries must be visible on open. The app launcher, where
# a clean prompt is the point, opts in per-invocation with the
# --hide-before-typing flag (see hypr/modules/60-binds.lua).

# Match beyond the display name so "mail" finds Thunderbird, "browse" Chrome,
# "term" kitty. keywords/comment carry the descriptive text authors wrote.
fields=filename,name,generic,keywords,categories,comment

# Open Terminal=true desktop entries in kitty. {cmd} keeps the command exactly
# where it belongs in the argv.
terminal=kitty -e {cmd}

# Expose "New Window" / "New Private Window" style .desktop actions.
show-actions=yes

# Hide entries that declare OnlyShowIn for a desktop we are not running.
filter-desktop=yes

# Frecently launched apps sort first; the cache lives in ~/.cache/fuzzel.
sort-result=yes

# Bold the selected entry, and show the match count on the right.
use-bold=yes
match-counter=yes

prompt=❯
placeholder=Search apps
icon-theme=Papirus
icons-enabled=yes

layer=overlay
anchor=center

[border]
width=2
radius=14
selection-radius=10

[colors]
# Soft, slightly translucent Dracula surface.
background=282a36f0
text=f8f8f2ff
prompt=bd93f9ff
input=f8f8f2ff
placeholder=6272a4ff

# Matched substring in green, so what you typed is obvious at a glance.
match=50fa7bff

# Selection is a soft purple wash rather than flat grey; the text stays bright.
selection=bd93f9a6
selection-text=f8f8f2ff
selection-match=8be9fdff

counter=6272a4ff
border=bd93f9ff
