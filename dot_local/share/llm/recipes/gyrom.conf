# Qwen3.8-Flash-Next Gyro-M (agentionai, TQ2_0 trellis) on Strata: one 92.0 GB file that holds both the weights
# (35.0 GB, GPU + RAM together) and the 8-bit n-gram table (the rest, read row by row off the disk).
# qwen4exp: 48 blocks, every 4th full-attention (2 kv heads, key/value 256) and the rest SSM, so KV at k8v4 is
# ~9 KiB/token of KV = 0.55 GiB at 64K, plus ~0.37 GiB of indexer rows (0.92 GiB together).
# 64K not 128K: the weights are the binding constraint here, not the context — 35.0 GB against 16 GB VRAM + 30 GiB
# RAM leaves the RAM copy nothing to spare, and every added KV GiB is taken from the expert page cache.
# The -noPLE variants (37.6 GB) are NOT usable with Strata: adopt.py hands shards[-1] to --ple-gguf, find_single()
# returns the -noPLE file itself, and GYRO_FILES pins only the full files.  The 92 GB download is the supported route.
# One-time writes besides the download: setup puts this model in the low-RAM mode (30 GiB RAM < arena 32.1 + 10 GiB
# headroom) and so writes a ~32 GB experts.bin into the pack, then runs --mmap-experts over it (low_ram_resident is
# false: the experts the GPU cache does not hold do not fit RAM either).  Reads only after that.
# Gyro needs engine 0.1.45.1+ (Hadamard-folded experts); upstream llama.cpp cannot load these files at all, so this
# recipe is Strata-only by nature.
# vision=cpu, not gpu (also Strata's own rule below 23.5 GB VRAM): the image encoder on the GPU holds ~1.4 GB of VRAM
# that the experts use better here.  Memory facts, 64K, desktop busy: GPU reader 3578 slots / 4.35 GiB of cache with
# ~1.0 GiB of VRAM free; CPU reader 4709 slots / 5.73 GiB with ~1.2 GiB free.  The CPU reader took no extra VRAM and
# freed 1.4 GB of it for experts, which is why it wins on this card.
# Measured at 64K with the desktop busy: ~21 GiB of RAM available; a repeated 5K prompt reuses 5127 of 5132 tokens,
# and a new one reads ~1.7 GB from the SSD against ~24 GB of expert reads (the page cache holds the rest).
about="Qwen3.8-Flash-Next Gyro-M (TQ2_0, ~IQ3_XXS quality at 35 GB) — Strata, weights on the SSD"
engine=strata
model=$HOME/models/gyrom
ctx=65536
kv=k8v4
vision=cpu
reserve=3072
experts=mmap
mtp=1
# the run config Strata keeps for this model (~/.local/share/strata/install/); per recipe, never shared
strata_config=strata-gyro-gyro-m.json
# `llm fetch gyrom` / `llm prune gyrom`
hf=agentionai/Qwen3.8-Flash-Next-Gyro-GGUF
files="Qwen3.8-Flash-Next-Gyro-M-TQ2_0.gguf"
bytes="91965774272"
fetch_dir=$HOME/models/gyrom
