# Inkling 2 Mini (Thinking Machines Lab) 26B-A3.4B looped MoE — unsloth UD-IQ3_XXS (Mainline_Support), llama.cpp master
# 8d60873 Vulkan, 256K context.
#
# FILE: unsloth/Inkling-2-Mini-GGUF, Mainline_Support/Inkling-2-Mini-UD-IQ3_XXS.gguf_file, imatrix-calibrated.
# Replaces InterpreticAI/Inkling-2-Mini-IQ3_XXS-GGUF, which had the same speed and a slightly worse fit to the model:
# same build, same flags, same corpora, 3 passes:
#   file                       code PPL            prose PPL          decode (256K, nc6 / nc5)
#   unsloth UD-IQ3_XXS         1.7810 +/- 0.0094   3.6379 +/- 0.063   36.1 / 37.3
#   InterpreticAI IQ3_XXS      1.7936 +/- 0.0095   3.6883 +/- 0.064   37.2 / -
# so ~1% better PPL for ~2% decode at equal placement; nc5 buys the 2% back and lands at the old 37 t/s.
#
# The root files in that repo do NOT load here: they are `inkling2` + blk.N.loop_attn_down (Unsloth's own layout, needs
# their fork). Mainline_Support holds the same tensors, byte for byte, as `inkling2_loop` with loop_*_ctrl_* names, which
# is what mainline reads. The `.gguf_file` extension is the repo's, not a typo — llama.cpp ignores extensions, and the
# name has to match the repo's basename for `llm fetch` to byte-check it.
#
# BUILD: master 8d60873, i.e. after #32735 (vulkan: support non-contiguous src in SCALE). That fix is the whole reason
# this recipe changed build: SiTU scales the two halves of each layer's fused gate_up output, those are strided views, and
# Vulkan's supports_op rejected SCALE on them, so the scheduler ran both SCALE ops of every layer on the CPU. Measured on
# the previous file, same flags, ctx 32K: prefill 435 -> 743 t/s, decode 26.2 -> 37.1 t/s. b12608 and older lack it.
# #32704 (loop slots re-shared after the scale pass) is in the same binary; it does nothing for a file without .scale
# tensors, but it is what makes every NVFP4-scale-carrying variant of this arch correct.
# Built with -DGGML_VULKAN=ON against Khronos Vulkan-Headers + SPIRV-Headers under ~/.local/opt (the distro ships no
# headers): the recipe only needs ~/.local/opt/llama-8d60873 to stay.
#
# PLACEMENT: --n-cpu-moe 5 is the largest residency that still leaves the desktop a reserve. Deterministic split at
# 262144 ctx / ub 512 / q4_0 KV / 3 passes: 14805 MiB of 16304, ~1.5 GiB spare with the browser open. Ladder measured at
# 256K: nc6 36.9 t/s (14302 MiB), nc5 37.3 (14805), nc4 39.8 (15100, ~1.2 GiB spare), nc2 59.6 (16019, ~0.3 GiB — the
# desktop would be working out of what is left). nc5 is the point where the last 4% of decode is not worth the reserve.
#
# UBATCH 512, unchanged and re-measured on this build at 256K/nc4: 512 -> 838 t/s prefill, 256 -> 711, 1024 -> 251. The
# 1024 figure is not a buffer failure (13558 MiB, lower than 512) — it is simply slower on the Vulkan paths here.
#
# PASSES = 3, the trained value, not tunable by intent; every other count is out of distribution and measured worse
# (2 passes also broke tool calling 1/4 against 4/4). `llm inkling2 --print` shows no --override-kv and that is deliberate.
#
# TIER: UD-IQ3_XXS (11.66 GB, 3.60 BPW). The next tier up was tried and rejected on cost, not on fit: UD-Q3_K_XL
# (13.63 GB) measures 1.7685 / 3.6095 PPL, i.e. ~0.7% better than UD-IQ3_XXS (inside one sigma of the corpus error), but
# at 256K it only loads with --n-cpu-moe 8..10 and decodes at 25.2-25.6 t/s — 36% slower for a difference the corpora
# cannot resolve. The source checkpoint is already NVFP4/MXFP8, so every 3-bit file is a re-quantisation of a quantised
# release; that is where any remaining loss lives, for all publishers.
#
# SAMPLING: this file carries the same general.sampling defaults as the previous one — temp 1.0, top_k 50, top_p 1.0, no
# --min-p. Unsloth's guide suggests top_k 0; the file's own metadata is used here because it is the trained value.
#
# ENGINE ENGINEERING: Vulkan, measured against ROCm on this card (RX 9070, RDNA4) with the same model and flags: Vulkan
# was equal-or-faster on both placements and ROCm also caps context near 49K because its compute buffer is ~10x larger.
# SGLang and vLLM are NVIDIA-only for this arch; Strata does not support inkling2_loop; Basalt needs sm_120 + CUDA 13.
#
# NOT USED, and why (measured today unless stated):
# - DSpark drafter: BOTH mainline master and the #32218 branch reject the shipped drafter — markov_w1 carries the padded
#   vocabulary (201024 rows) against this arch's unpadded 200058, so the load fails on tensor shape. Worth revisiting when
#   #32218 merges AND a drafter with an unpadded markov_w1 exists; expected gain from the publisher is ~1.06-1.23x.
# - #32752 (build the causal mask in chunks): open, not merged, and its chunk intermediates are F32 — a prefill/memory
#   trade that has to be re-measured, not assumed.
# - n-gram speculation: measured earlier at 27.2 t/s (ngram-simple, 4.9% acceptance) against 27 without.
# - ROCm: see above.
#
# CAPABILITIES, verified through the served endpoint on this file and build: tools 4/4 real calls, vision 2/2 (read a
# rendered serial number), context 262144 reported, `modalities.vision=true`.
# Writes: none while serving — weights are mmap'd, the same bytes every start, no pack or cache file.
about="Inkling 2 Mini 26B-A3.4B (looped MoE) UD-IQ3_XXS, 256K ctx, vision — llama.cpp Vulkan"
engine=llama
model=$HOME/models/inkling2/Inkling-2-Mini-UD-IQ3_XXS.gguf_file
mmproj=$HOME/models/inkling2/mmproj-F16.gguf
ctx=262144
kv=q4_0
llama_dir=$HOME/.local/opt/llama-8d60873
template=""
args="-ngl 999 --n-cpu-moe 5 -fa on -ub 512 -b 2048 -t 8 --parallel 1 --jinja --temp 1.0 --top-k 50 --top-p 1.0"
flags=""
mtp=0
# `llm fetch inkling2` / `llm prune inkling2`
hf=unsloth/Inkling-2-Mini-GGUF
files="Mainline_Support/Inkling-2-Mini-UD-IQ3_XXS.gguf_file mmproj-F16.gguf"
bytes="11663310784 639348160"
fetch_dir=$HOME/models/inkling2
