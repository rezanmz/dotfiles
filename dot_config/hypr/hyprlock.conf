# hyprlock — Dracula lock screen. Managed by chezmoi
# (dot_config/hypr/hyprlock.conf).
#
# Design notes
# ------------
# The lock screen is the one place you look at without doing anything, so it is
# worth more than a password box. Three layers, top to bottom:
#
#   1. The session screenshot, heavily blurred and darkened. `brightness` is
#      what makes this readable — without it, a bright window behind the blur
#      leaves the text fighting for contrast.
#   2. A time block, optically left-of-centre rather than dead centre, so the
#      password field below sits on the same axis and the whole thing reads as
#      one column.
#   3. A dim footer with user, host and keyboard layout; the layout is clickable,
#      which is the one thing you actually want on a lock screen.
#
# Colours are the Dracula values from dot_config/hypr/modules/00-theme.lua:
# bg #282a36, fg #f8f8f2, purple #bd93f9, pink #ff79c6, comment #6272a4.
#
# Validated statically against the hyprlock 0.9.6 reference config at
# /usr/share/hypr/hyprlock.conf and its option set. NOTE: do not "test" this by
# launching hyprlock — it locks the live session. Verify keys against that
# reference instead.

$font = Hack Nerd Font
$accent = rgba(bd93f9ff)
$accent2 = rgba(ff79c6ff)
$fg = rgba(f8f8f2ff)
$muted = rgba(6272a4ff)
$shadow = rgba(00000099)

general {
    hide_cursor = true
}

# Fade the whole screen in and out, and animate the password dots. The dot
# animation is the only motion once the screen settles, which makes an
# otherwise static screen feel alive rather than frozen.
animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 4, easeOutQuint
    animation = fadeOut, 1, 4, easeOutQuint
    animation = inputFieldDots, 1, 2, easeOutQuint
}

background {
    monitor =
    path = screenshot

    # 4 passes of a wide kernel: enough to erase legibility of whatever was on
    # screen, which matters because a screenshot can contain anything.
    blur_passes = 4
    blur_size = 12

    # Darken it. 0.45 keeps the wallpaper's colour visible while guaranteeing the
    # text above it is readable no matter what was underneath.
    brightness = 0.45
    contrast = 0.9
}

# ---------------------------------------------------------------- clock block

label {
    monitor =
    text = $TIME
    font_size = 104
    font_family = $font
    color = $fg
    shadow_color = $shadow
    shadow_size = 12
    shadow_passes = 2

    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 20
    font_family = $font
    color = $muted
    shadow_color = $shadow
    shadow_size = 6

    position = 0, 62
    halign = center
    valign = center
}

# ------------------------------------------------------------------- password

input-field {
    monitor =
    size = 22%, 46
    outline_thickness = 2
    rounding = 10

    # Opaque enough to be a real field rather than a floating outline.
    inner_color = rgba(282a36dd)
    outer_color = $accent
    check_color = $accent2
    fail_color = rgba(ff5555ff)

    font_color = $fg
    font_family = $font

    placeholder_text =  Enter password…
    fail_text =  Wrong password

    fade_on_empty = false
    dots_size = 0.26
    dots_spacing = 0.4
    dots_center = true

    position = 0, -70
    halign = center
    valign = center
}

# ---------------------------------------------------------------------- footer

# User and host, in one shell call.
#
# cmd[update:0] runs the command once and never refreshes (0 = no periodic
# update). Both $USER and $(hostname) are expanded by /bin/sh, so this needs no
# hyprlock variable at all — which is the point: hyprlock substitutes its own
# $VARS in plain text labels but hands cmd[] to a shell, and mixing the two
# would be a guess. One shell, one expansion rule.
label {
    monitor =
    text = cmd[update:0] printf '%s@%s' "$USER" "$(hostname)"
    font_size = 13
    font_family = $font
    color = $muted

    position = 0, 34
    halign = center
    valign = bottom
}

# Keyboard layout, clickable. $LAYOUT expands to a list and the first entry that
# matches the active layout is shown, so this works with the us,ir pair in
# 50-input.lua without hardcoding either name.
label {
    monitor =
    text = $LAYOUT[en,us,ir,fa]
    font_size = 13
    font_family = $font
    color = $muted

    position = 0, 34
    halign = right
    valign = bottom
    # Two layouts are configured (us,ir in 50-input.lua), so this cycles them.
    # Plain hyprctl, not the Lua `hl.dsp` form — hyprlock runs this through a
    # shell, not through Hyprland's Lua config context.
    onclick = hyprctl switchxkblayout all next
}

# Hint that does double duty: tells you the layout is clickable, and gives the
# screen a baseline element so it does not look like it is missing a footer.
label {
    monitor =
    text = click the layout to switch
    font_size = 11
    font_family = $font
    color = rgba(6272a488)

    position = 0, 16
    halign = right
    valign = bottom
}
