# tmux — Dracula, mouse-friendly. Managed by chezmoi (dot_config/tmux/tmux.conf).
#
# Prefix stays at the default Ctrl+b. True colour needs the terminal to agree:
# kitty reports COLORTERM=truecolor, so terminal-features is enough for tmux 3.2+ and
# the explicit overrides below keep older setups honest.

set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Mouse: scroll, click panes, resize. Natural for a desktop.
set -g mouse on

# History and timing.
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on

# Intuitive splitting: | and - split in the direction they look.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Reload config, and a clearer list of keys.
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Status line — Dracula.
set -g status-position bottom
set -g status-style "bg=#282a36,fg=#f8f8f2"
set -g status-left "#[fg=#282a36,bg=#bd93f9,bold] #S #[fg=#bd93f9,bg=#282a36]"
set -g status-left-length 20
set -g status-right "#[fg=#6272a4]#{?window_zoomed_flag,ZOOM ,}#[fg=#8be9fd]%H:%M #[fg=#6272a4]%d %b"
set -g status-right-length 40

# Windows.
setw -g window-status-format "#[fg=#6272a4] #I:#W "
setw -g window-status-current-format "#[fg=#282a36,bg=#50fa7b,bold] #I:#W #[bg=#282a36,fg=#50fa7b]"
setw -g window-status-separator ""

# Panes: inactive border is muted, active border is Dracula purple.
set -g pane-border-style "fg=#44475a"
set -g pane-active-border-style "fg=#bd93f9"

# Message and command line.
set -g message-style "bg=#44475a,fg=#f8f8f2"
set -g message-command-style "bg=#44475a,fg=#f8f8f2"
setw -g clock-mode-colour "#bd93f9"

# tmux 3.4+ shows popups; keep them dark too.
set -g popup-style "bg=#282a36,fg=#f8f8f2"
set -g popup-border-style "fg=#bd93f9"
