# Swift 1.5 Qwen3.8-27B — Heretic (abliterated) IQ3_XXS.  Same runtime profile as swift15 (~13.1 GiB at 96K, 42 tok/s),
# and it ships its own chat template, which already accepts omp's reasoning_effort aliases.
# MTP=1 adds --spec-type draft-mtp (faster drafting, a second model in VRAM).
about="Swift 1.5 27B IQ3_XXS heretic (abliterated) — 42 tok/s, 13.1 GiB at 96K"
engine=llama
model=$HOME/models/swift15/heretic-IQ3_XXS-mtp.gguf
ctx=98304
kv=q4_0
llama_dir=$HOME/.local/opt/llama-b12079
template=$HOME/models/swift15/heretic-chat-template.jinja
args="-ngl 99 -fa on -ub 1024 -b 2048 -t 8 --parallel 1 --cache-ram 16384 --jinja --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 0.0 --repeat-penalty 1.0"
flags=""
mtp=0
