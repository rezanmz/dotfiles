# Inkling 2 Mini (Thinking Machines Lab) 26B-A3.4B looped MoE — unsloth UD-IQ3_XXS (root `inkling2` layout),
# llama.cpp Vulkan fork d99ce33 + tokenizer patch + FA split-k (default 4, env 8). 256K, DSpark, vision.
#
# GPU: Radeon RX 9070 XT (Vulkan reports XT; lspci is the Navi 48 9070/XT/GRE family), gfx1201, 16 GB, RADV.
#
# WHY THIS BUILD: mainline 8d60873 measured 427 t/s prefill / 38.1 t/s decode at 32K, nc5, q4_0 KV. This fork
# with --n-cpu-moe 0 (all experts on GPU) and -ub 640 measures 1,161 t/s prefill / 115-122 t/s decode at 256K
# on a 9.3K prompt with DSpark n=2 (1,497 / 148 at 32K); at nc6/ub512 it was 441 / 62. Published #32773 numbers
# (47.6 -> 80.2 t/s code) are an upper bound: RX 9070 XT 16 GB, but a 12.1 GB IsValorum target at 184K and n_max 4.
# n_max 2 remains the general default; n=3 is faster on pure code but loses on chat/reasoning.
#
# FILE: unsloth/Inkling-2-Mini-GGUF root `Inkling-2-Mini-UD-IQ3_XXS.gguf`, arch `inkling2`. The fork does not load
# the Mainline_Support `inkling2_loop` file; the root file is the same 11.66 GB IQ3_XXS quant, imatrix-calibrated.
# Drafter: dspark-Inkling-2-Mini-Q8_0.gguf (402,278,560 B, sha256 2ec78510...), q4_0 draft KV.
#
# DSPARK: n_max 2 keeps draft acceptance high. n_max 4 lost 9% on thinking-heavy chat (41.5 vs 45.6) while n_max 2
# gained 5-13% there and 38-43% on code at nc6. All-GPU at 256K/ub640: code 115-122 t/s (87-94% accept)
# at temp 1.0; n=3 adds 2-5% on code but loses chat, so n=2 remains the general default.
#
# FA SPLIT-K: RDNA long-KV decode (N=1, KV>=4096) uses shader_core_count*4 by default; this recipe exports
# GGML_VK_FA_SPLIT_K_MULT=8. 32K tg64 49.14 -> 51.16 (+4.1%). With DSpark at 9.3K: 73.88 -> 74.48 (+0.8%),
# output bit-identical. The reduction order can flip near-tie tokens without speculation (one sample:
# q2_k -> q2_K); set GGML_VK_FA_SPLIT_K_MULT=2 to restore the upstream order. Prefill (N>1) is unchanged.
#
# ALL-GPU: --n-cpu-moe 0 keeps all 24 physical layers on the GPU; --fit off is required because the fitter
# refuses -ngl 999. Ladder at 256K/9.3K/ub512: nc0 99 t/s, nc2 88, nc4 66, nc5 63, nc6 62. nc0 at ub640 is
# 115-122 t/s. nc0 leaves ~0.2-0.7 GiB VRAM free (sysfs; depends on the desktop); nc4 leaves ~0.55 GiB at
# 66 t/s, nc5 ~1.1 GiB at 63.
#
# UBATCH: 256, retuned 2026-11-27 with the desktop holding ~2.3 GiB of the 16 GiB card. The 256K KV keeps ~85 MB
# free, so a 640-token prefill buffer does not fit in VRAM and llama.cpp spills it to host memory: pp 437-504,
# tg 75-82 at 43K/14.6K. 320-2048 are all in that spilled regime; 256 is the last fast step (6/6 runs: pp
# 1,136-1,177 at 14.6K, 965 at 43.8K; tg 102-103). The old 640 figure was measured with the desktop near-idle;
# with VRAM free it is still faster for prefill (ctx 192K ub640: pp 1,502, tg 100). ctx 256K + ub256 is the
# robust point for this machine as it is actually used.
#
# SPECULATION OFF (2026-11-27). DSpark pays ~1 ms per prompt token to build the drafter state, so it halves
# prefill (14.6K: 1,126 -> 447-509 pp) and only wins when acceptance is high; on this box it lost decode too
# (doc 45-63 vs 103, code 89-105 vs 100). 128K/512 was the best spec point (code 104.8) and still lost prefill.
# ngram-mod neither helps nor hurts (85.1 code / 102.6 doc). To re-enable for a code-only run, add:
# draft=$HOME/models/inkling2/dspark-Inkling-2-Mini-Q8_0.gguf, draft_n=2, draft_kv=q4_0.
#
# OTHER ENGINES (measured today, same box, desktop loaded): mainline master 6d8a888 + bartowski loop IQ3_XXS
# (13.31 GB, no DSpark on mainline: drafter load bug #33091) pp 1,577 / tg 77.5 at 8K vs this fork 1,867 / 113.
# DFlash2 Q8_0 (ethanwtodd) on mainline: mean accept 3.76 code / 2.34 doc, 61 t/s code, and prefill 306 at 14.6K
# (drafter walks the prompt). Vulkan fusions (#33116) and topk_moe bias (#32957) remain unmerged; not taken.
# Strata 0.1.69 + SQ-10 at 256K: pp 1,754, tg 58.8-71.3, drafting off (its own probe: 0.89x). SQ-15 at 32K put
# 3.06 GB of experts in RAM: 48 t/s. Better prefill, worse decode than this fork.
#
# PLACEMENT: --n-cpu-moe 0 + --fit off; mmproj on CPU (--no-mmproj-offload). The old nc6 offloaded the prelude
# (layers 0-5, single-pass) and cost ~40% decode; nc0 was not tried until the fork's lower buffers made it fit.
# Do not offload the looped core (nc7+): on Vulkan the compute buffer jumps ~0.9 -> 7.7 GiB (#32777).
# Vision verified on a rendered serial (SN-4721); tools 4/4.
#
# TOKENIZER: the fork lacked upstream #32799; one line (`ignore_merges = true` for inkling2) is patched in. It
# tokenizes `def f(*args, **kwargs):` as 10 tokens, not 12.
#
# NOT USED / REJECTED, measured today unless stated:
# - mainline #32218 DSpark: expects markov_w1 [256,200058]; the shipped drafter is [256,201024] and has no
#   markov_w2, so it cannot load this drafter.
# - PR #32773 branch (0a9105d): loads the padded w1, but its head expects a 3*n_embd (6912) state while the
#   speculative code passes n_embd (2304); measured 27.2 t/s / 32% acceptance, i.e. a loss.
# - mainline + #32752 (chunked mask): 386.6 pp / 37.8 tg at 32K vs 427.3 / 38.1 for plain 8d60873; dropped.
# - `inkling2_loop` files (Q2_K_XL, IQ2, Mainline_Support) are the 24-physical-layer layout with loop aliases;
#   this fork's `inkling2` loader expects the 48-visit layout and maps 588 of 744 tensors. Fully-resident Q2
#   needs the loop loader ported; otherwise the 9.14 GB file does not load.
# - Q3_K_XL: better KLD but needs loop-aware -ot; not pursued after the fork's prefill/decode win.
# - Runtime knobs measured worse: --backend-sampling 44.6 t/s / 42% accept (vs 68.1 / 93%), --moe-cache
#   numeric 22.1 t/s (disables weight repacking), --moe-cache soft 69.8 (no gain), turbo3 KV 48.0 / 52%,
#   coopmat off 374 pp / 47 tg, 2 slots 29+21 t/s. `-ub 640/768` buys 455/463 pp for 62/61 tg; 512 stays.
# - p_min is inert: the Inkling2 DSpark ctor clamps it to 0 (no confidence head); n3 p_min runs vary by GPU state.
#
# Writes: none while serving — weights are mmap'd, the same bytes every start, no pack or cache file.
about="Inkling 2 Mini 26B-A3.4B (looped MoE) UD-IQ3_XXS, 256K ctx, vision — llama.cpp Vulkan fork"
engine=llama
model=$HOME/models/inkling2/Inkling-2-Mini-UD-IQ3_XXS.gguf
mmproj=$HOME/models/inkling2/mmproj-F16.gguf
ctx=262144
kv=q4_0
llama_dir=$HOME/.local/opt/llama-fork
template=""
# spec off: see SPECULATION above. For a code-only run add these three back with draft_n=2 or 3.
# draft=$HOME/models/inkling2/dspark-Inkling-2-Mini-Q8_0.gguf
# draft_n=2
# draft_kv=q4_0
engine_env="GGML_VK_FA_SPLIT_K_MULT=8"
args="-ngl 999 --n-cpu-moe 0 --fit off -fa on -ub 256 -b 2048 -t 8 --parallel 1 --jinja --temp 1.0 --top-k 50 --top-p 1.0 --no-mmproj-offload"
flags=""
mtp=0
think=auto
# `llm fetch inkling2` / `llm prune inkling2`
hf=unsloth/Inkling-2-Mini-GGUF
files="Inkling-2-Mini-UD-IQ3_XXS.gguf dspark-Inkling-2-Mini-Q8_0.gguf mmproj-F16.gguf"
bytes="11663309504 402278560 639348160"
fetch_dir=$HOME/models/inkling2
