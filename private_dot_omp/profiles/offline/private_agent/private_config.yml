# The one local profile: everything here is a locally hosted model, nothing leaves the machine.
# models.yml beside this file is WRITTEN BY `llm <recipe>` on every start (provider "local", id = the recipe name), so
# `omp --profile offline` always talks to whatever llm started last.  This file only decides the roles, which all point
# at that one model, plus what is switched off.
#
# The role lines and enabledModels below name `local/*` — every model this provider declares, which is always exactly
# the one recipe llm last started.  That is deliberate: an id like `local/pi27` would go unresolvable the moment another
# recipe started (models.yml is rewritten wholesale), and a role naming a missing model fails as "set an API key"
# rather than "no such model".  `llm <recipe>` does still rewrite those lines to the exact id, which is harmless because
# `local/*` and `local/<that recipe>` name the same single model; a later `chezmoi apply` reverting them to `local/*`
# changes nothing about which model resolves.  Edit anything else here freely — llm touches only those lines.
#
# defaultThinkingLevel is the effort omp asks a model for.  `high` — one step above medium — is the choice across
# every local model: the higher tiers cost minutes per model call at this machine's decode rate.  A recipe that wants
# a different level for its own model sets thinking= rather than changing this line, because it is shared.
modelRoles:
  smol: local/*
  slow: local/*
  vision: local/*
  plan: local/*
  designer: local/*
  commit: local/*
  tiny: local/*
  task: local/*
  advisor: local/*
  judge: local/*
  widget: local/*
  memory: local/*
