# Huihui Qwen3.8-27B abliterated, GSQ-RCO IQ3_XXS + MTP (huihui-ai).  The crude per-model abliteration: every
# layer's refusal direction removed (not just layers 17-52 like the UD series), MTP and vision untouched.
# qwen35: 65 blocks, every 4th full-attention (4 kv heads, key/value 256) and the rest SSM, so 16 attention layers
# hold KV and the other 49 keep a fixed recurrent state.
# KV at q4_0 is 18 KiB/token (16 layers x 4 heads x 256 key + 256 value, half a byte each) = 2.25 GiB at 128K.
# Fixed costs on top of the weights: 598 MiB of SSM state (R f32 22.5 + S f32 576, 65 layers, 1 cell), 656 MiB of
# Vulkan compute buffer, 40 MiB of nextn buffer, and the 388 MiB token-embedding table left in CPU-mapped memory.
# Weights IQ3_XXS 9.30 GiB of the 9.74 GiB file; the MTP layer is inside this file (blk.64, nextn_predict_layers=1).
# Tier: IQ3_XXS (9.74 GiB) over UD-IQ3_XXS (10.3 GB) because the UD series only ablates layers 17-52, i.e. it keeps
# refusals in the first 17 layers; Q4_K_XL (17.4 GB) would not fit 16 GB VRAM at all.
# Measured 2026-11-15, 16304 MiB card, desktop holding ~2.7 GiB (this is the busy baseline, not an idle one):
#   128K, ub 512, vision CPU ..... 14.69 GiB used, 1.23 GiB free after a 60K-token prompt
#   144K, ub 512, vision CPU ..... 15.07 GiB used, 0.85 GiB free — too close, the desktop needs ~1 GiB
#   160K, ub 512, vision CPU ..... 15.44 GiB used, 0.48 GiB free — rejected
# Vision on the GPU costs 0.93 GiB of weights-backed reserve (mmproj offload), so it runs on the CPU: the tower is
# small and images are rare, whereas the 0.93 GiB is 52K tokens of KV.  /props still reports vision: true.
# ub 512 not 1024: the compute buffer follows ubatch, and 512 leaves 208 MiB more VRAM for KV at 128K (1014 pp t/s
# against 952 at ub 1024), which is the same trade the other qwen35 recipes make.
# MTP is live: --spec-type draft-mtp against the file's own nextn layer; measured acceptance 0.65-1.00 per request,
# and decode 43 t/s without it against 87 t/s with it (16K, q4_0, same prompt).
# The chat template is patched: upstream raises a 500 for any reasoning_effort outside xhigh/medium/low, and omp sends
# its own aliases (minimal/high/max/auto).  Patched copy tracked in chezmoi beside the recipe.
# llama.cpp b12422, not b12079: qwen35 MTP on a recurrent-hybrid arch took fixes after 2026-11-03 (MTP conv
# snapshots per recurrent model, NextN layers in n_gpu_layers, mtmd 2x2 merge check).
# Writes: none while serving — the weights are mmap'd and every start reads the same bytes; no pack, no cache file.
about="Huihui Qwen3.8-27B abliterated IQ3_XXS, 128K ctx, vision + MTP — llama.cpp Vulkan"
engine=llama
model=$HOME/models/huihui27/Huihui-Qwen3.8-27B-abliterated-GSQ-RCO-IQ3_XXS-mtp.gguf
mmproj=$HOME/models/huihui27/mmproj-model-bf16.gguf
ctx=131072
kv=q4_0
llama_dir=$HOME/.local/opt/llama-b12422
template=$HOME/.local/share/llm/templates/huihui27.jinja
args="-ngl 99 --no-mmproj-offload -fa on --image-min-tokens 1024 -ub 512 -b 2048 -t 8 --parallel 1 --cache-ram 16384 --jinja --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 0.0 --repeat-penalty 1.0"
flags=""
mtp=1
# `llm fetch huihui27` / `llm prune huihui27`
hf=huihui-ai/Huihui-Qwen3.8-27B-abliterated-GGUF
files="Huihui-Qwen3.8-27B-abliterated-GSQ-RCO-IQ3_XXS-mtp.gguf mmproj-model-bf16.gguf"
bytes="10442827296 931145888"
fetch_dir=$HOME/models/huihui27
