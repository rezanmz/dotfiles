# Ternary-Bonsai-2.5-27B (PrismML), Q2_0 + MTP — stock llama.cpp b12608 Vulkan.
#
# The model: Qwen3.8-27B hybrid-attention (64 blocks, every 4th full attention, 4 kv heads, head_dim 256) with
# ternary weights {-1,0,+1} g128 and a blockwise Hadamard rotation folded into the weights, so 1.76 bpw / 5.93 GB
# for the model.  Agentic release of Bonsai 2: tool calling within noise of FP16 (77.2 vs 77.7 averaged over
# tau2/tau3/BFCL v3/v4/AppWorld) and 90% of FP16 agentic coding (SWE-bench Verified 75.6, Terminal-Bench 2.1 60.1).
#
# PACKING: Q2_0-mtp, the stock-llama.cpp packings.  PTQ1_0 (5.93 GB) and PQ2_0 need the PrismML fork, which ships
# CUDA and Metal kernels only; Q2_0 runs on upstream llama.cpp >= b11556 (arch + Hadamard FWHT merged upstream,
# incl. Vulkan #29772) and every tensor here loaded on the Vulkan backend of b12608.  Older stock builds load Q2_0
# silently and produce garbage, so the version floor is real: b12608 here.
#
# Weights: 7.36 GiB, 27.32 B params, Q2_0.  Fixed costs on top: ~0.9 GiB SSM/recurrent state + Vulkan compute at
# ub 512.  KV at q4_0 measures 21.3 KiB/token from the loaded image, so 192K is 4.0 GiB.
# Fits on this card (16 GB, Chrome holding ~2 GiB), engine's own VRAM after load, one model at a time:
#   128K ....... 13216 MiB used, ~3.0 GiB free
#   192K ....... 14801 MiB used, 1503 MiB free  <- adopted
#   262144 ..... 15943 MiB used,  361 MiB free  <- REJECTED: no desktop reserve
# A 143K-token prompt ran through at 192K: accepted, 532 t/s prefill, VRAM constant (KV preallocated), answer right.
#
# MTP: the -mtp file carries the nextn draft head; `mtp=1` adds --spec-type draft-mtp on the target file.
# Draft depth and probability floor were swept over a fixed six-prompt set (300 tokens each, temp 0.7, two reps):
#   no draft ............ 53.9-54.2 t/s   (llama-bench tg128 58.0 t/s, memory-bound: 7.9 GB/token of 640 GB/s)
#   n-max 2 ............. 84.5 t/s, acceptance 0.63
#   n-max 3, p-min 0 ..... 84.1 t/s        n-max 3, p-min 0.1 ... 79.3-88.6 t/s, acceptance 0.53-0.59
#   n-max 4, p-min 0 ..... 85.4 t/s        n-max 4, p-min 0.1 ... 85.1-92.7 t/s, acceptance 0.51-0.55  <- adopted
#   n-max 4, p-min 0.05 .. 87.3 t/s        n-max 4, p-split 0.3 .. 84.3 t/s
#   n-max 5, p-min 0.1 ... 74.5 t/s, acceptance 0.43 (drafts past 4 are mostly wasted)
#   draft KV q8_0 ........ 87.6 t/s (inside the noise; the draft context is one layer, not worth the VRAM)
# So ~85-93 t/s, i.e. 1.6x plain decode.  The draft pass plus verification costs ~11 ms per emitted group, which is
# why per-pass bandwidth stays around 260 GB/s even though the target pass alone sustains 460 GB/s.
# Acceptance is content-dependent, so throughput is too: a permissions-guide prompt accepted 0.28 and ran 66 t/s;
# a 47.7K-token prompt prefilled at 883 t/s and decoded at 79 t/s (n-max 4, p-min 0.1 throughout).
#
# VISION: mmproj BF16 shipped separately, kept on the CPU (--no-mmproj-offload) because a 931 MB projector on the
# GPU eats the 1.5 GiB reserve; it costs ~1.6 GiB host RAM instead.  Verified by OCR of a rendered image (exact text
# "TERNARY BONSAI 2.5" / "code 7429" and both shapes), not by a flag.
# Tool calls verified through /v1/chat/completions with finish_reason=tool_calls.
#
# Template: upstream raises 500 for any reasoning_effort outside xhigh/medium/low (the model defaults to xhigh), and
# omp sends its own aliases, so templates/bonsai25.jinja is this GGUF's own template with one hunk: minimal/none/off
# -> low, medium -> medium, everything else -> xhigh.  The model card says low is unsupported and behaves like xhigh.
#
# PROVENANCE (audited 2026-11-26): both files' sha256 equal the Hub LFS oids (b0f83de8… model, e287342d… mmproj).
#  - Header: 866 tensors, arch qwen35, 65 blocks (64 + blk.64 nextn), vocab 248320, 24 heads / 4 kv heads,
#    key and value length 256, full_attention_interval 4, ctx 262144 — Qwen/Qwen3.8-27B's config.json field for field.
#  - Tensor types: 402 x Q2_0 (the rotated ternary body), 456 x F32 (norms and g128 group scales), and 8 x Q4_0 in
#    blk.64 — the MTP head, which NOTICE.txt documents as started from Qwen3.8-27B's MTP head via Unsloth's UD-Q4_K_M
#    and fine-tuned by PrismML, so its Q4_0 tensors are explained rather than suspicious.
#  - Metadata carries the card's sampling defaults (temp 1.0, top_p 0.95, top_k 20, min_p 0.05); min_p is overridden.
#  - NOT verifiable: no pre-quantization ternary checkpoint is published, so the ternary assignment, the Hadamard
#    basis and the head's fine-tune cannot be checked against a reference.  The benchmark table is the publisher's.
#
# Rejected: PTQ1_0 / PQ2_0 (fork-only kernels, no HIP or Vulkan path in the fork); 262144 context (above);
# kv q8_0 (doubles the cache, 115K max, no measured need).
about="Ternary-Bonsai-2.5-27B Q2_0 + MTP, 192K, vision CPU — llama.cpp b12608 Vulkan"
engine=llama
model=$HOME/models/bonsai25/Ternary-Bonsai-2.5-27B-Q2_0-mtp.gguf
mmproj=$HOME/models/bonsai25/Ternary-Bonsai-2.5-27B-mmproj-BF16.gguf
ctx=196608
kv=q4_0
llama_dir=$HOME/.local/opt/llama-b12608
template=$HOME/.local/share/llm/templates/bonsai25.jinja
args="-ngl 99 --no-mmproj-offload -fa on -ub 512 -b 2048 -t 8 --parallel 1 --cache-ram 8192 --jinja --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 0.0 --repeat-penalty 1.0"
flags=""
think=auto

mtp=1

# `llm fetch bonsai25` / `llm prune bonsai25`
hf=prism-ml/Ternary-Bonsai-2.5-27B-GGUF
files="Ternary-Bonsai-2.5-27B-Q2_0-mtp.gguf Ternary-Bonsai-2.5-27B-mmproj-BF16.gguf"
bytes="7912178944 931145856"
fetch_dir=$HOME/models/bonsai25
